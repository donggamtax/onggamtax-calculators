# 동감 세무회계 직원 전용 법령 검색 서버 (Cloudflare Workers 무료 요금제)
# 배포는 .github/workflows/deploy-staff-api.yml 이 자동으로 합니다.
name = "taxdg-staff-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# 질문 내역 저장소. id는 배포 작업이 'taxdg-staff-history' 이름으로 찾거나 만들어 채웁니다.
[[kv_namespaces]]
binding = "HISTORY"
id = "__HISTORY_KV_ID__"
