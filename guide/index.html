<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>고객 안내 | 동감 세무회계</title>
<link rel="icon" href="../logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--brand:#3D5F70;--deep:#2C4756;--tint:#EEF4F6;--warm:#B8945C;--ink:#18232B;--muted:#66737C;--line:#E1E7EA;--paper:#F6F8F9;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.7;word-break:keep-all;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
.hd{background:#fff;border-bottom:1px solid var(--line)}
.hd .in{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.hd img{height:26px;width:auto}
.hd .tag{margin-left:auto;font-size:13px;font-weight:600;color:var(--brand)}
main{max-width:760px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.04em;line-height:1.3}
.lead{color:var(--muted);margin:8px 0 20px;font-size:15px}
.q{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.q:focus{outline:3px solid rgba(61,95,112,.25);border-color:var(--brand)}
.tabs{display:flex;gap:8px;margin:14px 0 16px;flex-wrap:wrap}
.chip{font:inherit;font-size:15px;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.item>button{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:10px;padding:16px;cursor:pointer;font-weight:700;font-size:16px}
.item>button:focus-visible{outline:3px solid var(--brand);outline-offset:-3px}
.item .cat{font-size:12px;font-weight:700;color:var(--deep);background:var(--tint);border-radius:6px;padding:2px 8px;white-space:nowrap}
.item .ar{margin-left:auto;color:var(--muted);transition:transform .15s}
.item[data-open=true] .ar{transform:rotate(180deg)}
.item .bd{display:none;padding:0 16px 18px;white-space:pre-wrap;font-size:15.5px;border-top:1px solid var(--line);padding-top:14px}
.item[data-open=true] .bd{display:block}
.msg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.msg.err{color:#a33;border-color:#e8c4c4}
.ft{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.ft a{font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header class="hd"><div class="in"><img src="../logo.png" alt="동감 세무회계" width="1010" height="151"><span class="tag">고객 안내</span></div></header>
<main>
  <h1>신고 안내 · 이용 매뉴얼</h1>
  <p class="lead">동감 세무회계 고객님께 드리는 안내입니다. 궁금한 점은 담당자에게 편하게 문의해 주세요.</p>
  <div id="app"><div class="msg">불러오는 중입니다…</div></div>
  <div class="ft">문의 <a href="tel:01082781382">010-8278-1382</a> · 동감 세무회계<br>이 페이지는 고객님께만 드린 비공개 링크입니다. 다른 곳에 공유하지 말아 주세요.</div>
</main>
<script src="../staff/config.js"></script>
<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var app = $("#app"), items = [], cat = "전체", q = "", openId = {};
  var key = new URLSearchParams(location.search).get("k") || "";
  try{ if(key) history.replaceState(null, "", location.pathname); }catch(e){} // 주소창·기록에 키가 남지 않게
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function rich(s){ return esc(s).replace(/https:\/\/[^\s<]+/g, function(u){ var t = u.replace(/[.,)]+$/, ""), tail = u.slice(t.length); return '<a href="' + t + '" target="_blank" rel="noopener noreferrer">' + t + '</a>' + tail; }); }
  function msg(t, err){ app.innerHTML = '<div class="msg' + (err ? " err" : "") + '">' + esc(t) + '</div>'; }
  function draw(){
    if(!items.length) return msg("안내 자료를 준비 중입니다. 조금만 기다려 주세요.");
    var cats = ["전체"]; items.forEach(function(it){ if(it.category && cats.indexOf(it.category) < 0) cats.push(it.category); });
    var ql = q.toLowerCase();
    var list = items.filter(function(it){ return (cat === "전체" || it.category === cat) && (!ql || (it.title + " " + it.body).toLowerCase().indexOf(ql) >= 0); });
    var focus = document.activeElement && document.activeElement.id === "q";
    app.innerHTML = '<input class="q" id="q" type="search" placeholder="찾기 (예: 부가세, 카드등록)" value="' + esc(q) + '">'
      + '<div class="tabs">' + cats.map(function(c){ return '<button type="button" class="chip" data-c="' + esc(c) + '" aria-pressed="' + (c === cat) + '">' + esc(c) + '</button>'; }).join("") + '</div>'
      + (list.length ? list.map(function(it){ var o = !!openId[it.id]; return '<article class="item" data-open="' + o + '"><button type="button" data-i="' + esc(it.id) + '" aria-expanded="' + o + '">' + (it.category ? '<span class="cat">' + esc(it.category) + '</span>' : '') + '<span>' + esc(it.title) + '</span><span class="ar" aria-hidden="true">▾</span></button><div class="bd">' + rich(it.body) + '</div></article>'; }).join("") : '<div class="msg">찾는 내용이 없습니다.</div>');
    if(focus){ var n = $("#q"); n.focus(); n.setSelectionRange(q.length, q.length); }
  }
  app.addEventListener("input", function(e){ if(e.target.id === "q"){ q = e.target.value; draw(); } });
  app.addEventListener("click", function(e){
    var c = e.target.closest("[data-c]"); if(c){ cat = c.dataset.c; return draw(); }
    var b = e.target.closest("[data-i]"); if(b){ openId[b.dataset.i] = !openId[b.dataset.i]; draw(); }
  });
  var ck = "guide.cache";
  if(!key){ try{ key = sessionStorage.getItem("guide.k") || ""; }catch(e){} }
  if(!key) return msg("링크가 올바르지 않습니다. 동감 세무회계에서 받은 주소로 다시 접속해 주세요.", true);
  try{ sessionStorage.setItem("guide.k", key); var c0 = JSON.parse(sessionStorage.getItem(ck) || "null"); if(c0 && c0.length){ items = c0; draw(); } }catch(e){}
  if(!window.STAFF_API) return msg("서버 주소가 설정되지 않았습니다.", true);
  fetch(window.STAFF_API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, referrerPolicy:"no-referrer", body: JSON.stringify({ action:"guide.list", key:key }) })
    .then(function(r){ return r.json(); })
    .then(function(b){
      if(b.error){ try{ sessionStorage.removeItem("guide.k"); sessionStorage.removeItem(ck); }catch(e){} return msg(b.error, true); }
      items = b.items || []; try{ sessionStorage.setItem(ck, JSON.stringify(items)); }catch(e){} draw();
    })
    .catch(function(){ if(!items.length) msg("내용을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.", true); });
})();
</script>
</body>
</html>
