# 직원 전용 법령 검색 서버(worker/)를 Cloudflare Workers에 배포합니다.
# 필요한 GitHub 저장소 비밀 값(Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  Cloudflare API 토큰 (Workers 편집 + Workers KV 편집 권한)
#   CLOUDFLARE_ACCOUNT_ID Cloudflare 계정 ID
#   LAW_OC                법제처 Open API 인증값(OC)
#   STAFF_PASSWORD        직원 전용 화면 비밀번호
#   SESSION_SECRET        로그인 서명용 임의 문자열(길게)
name: Deploy staff API

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-staff-api.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-staff-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LAW_OC STAFF_PASSWORD SESSION_SECRET; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then echo "::error::GitHub 비밀 값이 비어 있습니다:$missing"; exit 1; fi
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find or create history KV namespace
        working-directory: worker
        run: |
          TITLE=taxdg-staff-history
          api=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces
          id=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=100" | jq -r --arg t "$TITLE" '.result[] | select(.title==$t) | .id' | head -1)
          if [ -z "$id" ]; then
            id=$(curl -sf -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d "{\"title\":\"$TITLE\"}" "$api" | jq -r '.result.id')
          fi
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::KV 저장소를 만들지 못했습니다. API 토큰에 Workers KV Storage 편집 권한이 있는지 확인하세요."; exit 1; }
          sed -i "s/__HISTORY_KV_ID__/$id/" wrangler.toml

      - name: Deploy worker
        id: deploy
        working-directory: worker
        run: |
          npx --yes wrangler@4 deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set worker secrets
        working-directory: worker
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          printf '{"LAW_OC":%s,"STAFF_PASSWORD":%s,"SESSION_SECRET":%s}' \
            "$(jq -Rn --arg v "$LAW_OC" '$v')" "$(jq -Rn --arg v "$STAFF_PASSWORD" '$v')" "$(jq -Rn --arg v "$SESSION_SECRET" '$v')" > secrets.json
          npx --yes wrangler@4 secret bulk secrets.json
          rm -f secrets.json

      - name: Point the staff page at the worker
        if: steps.deploy.outputs.url != ''
        run: |
          printf '// 배포 작업이 자동으로 채웁니다. 직접 고치지 마세요.\nwindow.STAFF_API = "%s";\n' "${{ steps.deploy.outputs.url }}" > staff/config.js
          if ! git diff --quiet staff/config.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add staff/config.js
            git commit -m "직원 전용 화면 서버 주소 갱신"
            git push
          fi
