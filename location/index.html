<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찾아오시는 길 | 동감 세무회계 이동희 세무사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="description" content="동감 세무회계 찾아오시는 길. 경기도 고양시 덕양구 향동로 217 DMC플렉스데시앙 B동 824호. 전화 02-2088-1553.">
<link rel="icon" href="../logo.png">
<style>
:root{
  --brand:#3D5F70; --deep:#2C4756; --tint:#EEF4F6; --warm:#B8945C;
  --ink:#18232B; --muted:#66737C; --line:#E1E7EA; --paper:#F6F8F9;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--sans);color:var(--ink);background:#fff;line-height:1.65;word-break:keep-all;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
a:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:6px}

/* 머리글 (첫 화면과 같음) */
.hd{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:24px;padding-top:14px;padding-bottom:14px}
.hd .logo img{height:28px;width:auto}
.hd nav{margin-left:auto;display:flex;gap:24px}
.hd nav a{text-decoration:none;font-size:15px;font-weight:500}
.hd nav a:hover{color:var(--brand)}
.hd nav a[aria-current="page"]{color:var(--brand);font-weight:700}
.hd .tel{text-decoration:none;color:#fff;background:var(--brand);font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hd .tel:hover{background:var(--deep)}

/* 인사 */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#F1F6F8,#fff 90%);padding:72px 0 64px}
.hero::before{content:"";position:absolute;right:-160px;top:-200px;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(61,95,112,.14),transparent 65%)}
.hero .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(61,95,112,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(61,95,112,.06) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 75% 30%,#000 10%,transparent 60%);mask-image:radial-gradient(ellipse at 75% 30%,#000 10%,transparent 60%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:56px;align-items:center}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--brand);display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--warm)}
.hero h1{font-weight:800;font-size:clamp(32px,4.6vw,54px);line-height:1.25;letter-spacing:-.045em;margin:18px 0 22px}
.hero h1 em{font-style:normal;color:var(--brand);background:linear-gradient(transparent 68%,rgba(184,148,92,.28) 68%)}
.hero .lede{font-size:clamp(16px,1.6vw,18.5px);color:var(--muted);max-width:620px}
.hero .name{margin-top:22px;font-size:17px}
.hero .name b{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-right:6px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:16px;padding:14px 24px;border-radius:999px;transition:transform .25s,background .25s,border-color .25s,color .25s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--brand);color:#fff;box-shadow:0 14px 28px -16px rgba(61,95,112,.8)}
.btn.pri:hover{background:var(--deep)}
.btn.sec{background:#fff;border:1px solid #C9D3D8}
.btn.sec:hover{border-color:var(--brand);color:var(--brand)}
.btn svg{width:18px;height:18px}
.photo{position:relative;margin:0}
.photo::before{content:"";position:absolute;left:-14px;top:14px;right:14px;bottom:-14px;border:1.5px solid var(--warm);border-radius:24px;opacity:.55}
.photo img{position:relative;width:100%;aspect-ratio:325/377;object-fit:cover;border-radius:22px;box-shadow:0 30px 60px -36px rgba(24,35,43,.55);background:#D5DADC}


main section{margin-top:96px}
main section:first-child{margin-top:72px}
.sec-h{margin-bottom:26px}
.kicker{font-size:13px;letter-spacing:.2em;font-weight:700;color:var(--brand);text-transform:uppercase}
.sec-h h2{font-size:clamp(25px,3vw,34px);font-weight:800;letter-spacing:-.035em;margin-top:6px;line-height:1.3}
.sec-h p{color:var(--muted);font-size:15.5px;margin-top:8px}

/* 강점 */
.why{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.why li{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 26px 28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 36px -30px rgba(24,35,43,.35)}
.why li::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--warm))}
.why .ic{width:52px;height:52px;border-radius:15px;background:var(--tint);color:var(--brand);display:grid;place-items:center}
.why .ic svg{width:26px;height:26px}
.why .k{font-size:13px;font-weight:700;color:var(--warm);letter-spacing:.04em}
.why h3{font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1.35}
.why p{font-size:15.5px;color:var(--muted);line-height:1.7}

/* 경력 */
.career{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.timeline{list-style:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px 28px}
.timeline li{position:relative;display:grid;grid-template-columns:158px minmax(0,1fr);gap:4px 18px;padding:16px 0;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.timeline .when{font-size:14px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.timeline b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.timeline small{display:block;font-size:14px;color:var(--muted);line-height:1.6;margin-top:2px}
.timeline .now b{color:var(--brand)}
.works{display:flex;flex-direction:column;gap:14px}
.work{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 26px}
.work h3{font-size:16.5px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.work h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warm)}
.work ul{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px;color:#3E4C55;line-height:1.6}
.work li{padding-left:16px;position:relative}
.work li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:1.5px;background:var(--brand)}

/* 사례 */
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.case{display:flex;justify-content:space-between;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;text-decoration:none;transition:transform .25s,border-color .25s,box-shadow .25s}
.case:hover{transform:translateY(-3px);border-color:rgba(61,95,112,.4);box-shadow:0 24px 40px -30px rgba(24,35,43,.45)}
.case .t{font-size:13px;font-weight:700;color:var(--brand)}
.case .d{display:block;font-size:16px;font-weight:600;line-height:1.5;margin-top:2px}
.case .amt{flex:none;text-align:right;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.25;color:var(--brand);font-variant-numeric:tabular-nums;white-space:nowrap}
.case .amt small{display:block;font-size:12.5px;font-weight:600;color:var(--warm);letter-spacing:0}
.more{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.more a{color:var(--brand);font-weight:700;text-decoration:none;font-size:15px}
.more a:hover{text-decoration:underline}
.fine{font-size:13px;color:var(--muted)}

/* 사무실 */
.office{display:grid;gap:14px}
.office figure{margin:0;border-radius:18px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.office img{width:100%;height:100%;object-fit:cover}
.office .main{aspect-ratio:2/1}
.office .row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1fr);gap:14px;height:300px}
.office .sign img{object-position:center 20%}
.office .gam img{object-fit:contain;background:#ECEEF0;padding:12px}

/* 약속 */
.promise{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:48px 56px;text-align:center;overflow:hidden}
.promise::before{content:"\201C";position:absolute;left:28px;top:-20px;font-size:160px;font-weight:800;color:rgba(61,95,112,.1);line-height:1}
.promise p{position:relative;font-size:clamp(20px,2.5vw,27px);font-weight:800;letter-spacing:-.035em;line-height:1.55}
.promise p em{font-style:normal;color:var(--brand)}
.promise small{display:block;margin:18px auto 0;max-width:640px;font-size:15px;color:var(--muted);line-height:1.7}

/* 상담 */
.band{margin-top:96px;border-radius:24px;padding:44px 48px;background:linear-gradient(120deg,var(--brand),var(--deep));color:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:28px 40px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-90px;top:-110px;width:300px;height:300px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18)}
.band .t{font-size:clamp(22px,2.6vw,28px);font-weight:800;letter-spacing:-.035em;margin-bottom:14px}
.band dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:15px}
.band dt{color:rgba(255,255,255,.7)}
.band dd a{color:#fff}
.band .call{position:relative;z-index:1;text-decoration:none;background:#fff;color:var(--brand);border-radius:16px;padding:16px 26px;display:grid;gap:2px;text-align:right}
.band .call span:first-child{font-size:13px;font-weight:600;color:var(--muted)}
.band .call span:last-child{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.band a:focus-visible{outline-color:#fff}

footer{margin-top:72px;border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer img{height:22px;width:auto}
footer a{color:var(--brand);font-weight:600;text-decoration:none}

.fab{position:fixed;right:16px;bottom:16px;z-index:50;display:none;align-items:center;gap:8px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;padding:13px 19px;border-radius:999px;box-shadow:0 12px 30px -8px rgba(24,35,43,.45)}
.fab svg{width:18px;height:18px}

@media (prefers-reduced-motion:reduce){.btn,.case{transition:none}}
@media (max-width:960px){
  .why{grid-template-columns:1fr}
  .career{grid-template-columns:1fr}
}
@media (max-width:760px){
  .hd .wrap{flex-wrap:wrap;justify-content:space-between;gap:10px 16px;padding-top:12px;padding-bottom:10px}
  .hd .logo img{height:23px}
  .hd .tel{font-size:13px;padding:8px 13px}
  .hd nav{order:3;width:100%;margin-left:0;gap:20px;overflow-x:auto}
  .hd nav a{font-size:14px;white-space:nowrap}
  .hero .wrap{grid-template-columns:1fr;gap:40px}
  .photo{max-width:300px;margin:0 auto 0 14px}
  .cases{grid-template-columns:1fr}
  .office .row{grid-template-columns:1fr;height:auto}
  .office .row figure{aspect-ratio:3/2}
  .office .row .sign{aspect-ratio:9/10}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .hero{padding:44px 0 48px}
  main section{margin-top:72px}
  .timeline{padding:6px 20px}
  .timeline li{grid-template-columns:1fr}
  .case{flex-direction:column;align-items:flex-start;gap:8px}
  .case .amt{text-align:left}
  .promise{padding:36px 22px}
  .band{grid-template-columns:1fr;padding:32px 24px;border-radius:20px;margin-top:72px}
  .band .call{text-align:left}
  .band dl{grid-template-columns:1fr;gap:0}
  .band dd{margin-bottom:8px}
}


/* 카카오톡 */
.btn.kakao{background:#FEE500;color:#191919}
.btn.kakao:hover{background:#F4DA00}
.hd .kakao,.dg-hd .kakao{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#FEE500;color:#191919;font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px;white-space:nowrap}
.hd .kakao svg,.dg-hd .kakao svg{width:16px;height:16px}
.hd .kakao:hover,.dg-hd .kakao:hover{background:#F4DA00}
@media (max-width:760px){.hd .kakao,.dg-hd .kakao{display:none}}
.band .acts{position:relative;z-index:1;display:grid;gap:10px}
.band .call.k{background:#FEE500;color:#191919}
.band .call.k span:first-child{color:#5a4f00}
.band .call.k span:last-child{font-size:22px}
@media (max-width:760px){.band .acts{display:none}}
/* 첫 화면 경력 */
.hero h1{margin-bottom:26px}
.cv2{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:20px;padding:22px 28px 24px;box-shadow:0 18px 36px -30px rgba(24,35,43,.35);max-width:640px}
.cv2-h{font-size:12.5px;font-weight:700;letter-spacing:.16em;color:var(--warm);margin:0 0 10px}
.cv2-h:not(:first-child){margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.cv2 ul{list-style:none;display:flex;flex-direction:column;gap:11px}
.cv2 li{display:flex;align-items:center;gap:10px;font-size:16.5px;line-height:1.45;flex-wrap:wrap}
.cv2 li b{font-weight:700;letter-spacing:-.02em}
.cv2 li small{font-size:14px;color:var(--muted)}
.cv2 .tg{flex:none;display:inline-grid;place-items:center;min-width:38px;height:24px;padding:0 6px;border-radius:6px;background:var(--paper);border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:700}
.cv2 .tg.now{background:var(--brand);border-color:var(--brand);color:#fff}
.cv2 .lg{margin-left:auto;width:108px;height:26px;display:flex;align-items:center;justify-content:flex-end}
.cv2 .lg img{max-width:100%;max-height:100%;width:auto;height:auto}
@media (max-width:560px){.cv2{padding:18px 18px 20px}.cv2 li{font-size:15.5px}.cv2 .lg{display:none}.cv2 li small{flex-basis:100%;padding-left:48px;margin-top:-6px}}

/* 소개 글 */
main section.intro{margin-top:80px}
.letter{position:relative;background:#fff;border:1px solid var(--line);border-radius:24px;padding:40px 48px 36px;box-shadow:0 18px 36px -30px rgba(24,35,43,.35);max-width:880px}
.letter::before{content:"";position:absolute;left:0;top:32px;bottom:32px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--brand),var(--warm))}
.letter p{font-size:17px;line-height:1.85;color:#2F3B43}
.letter p+p{margin-top:14px}
.letter b{color:var(--ink);font-weight:700;background:linear-gradient(transparent 70%,rgba(184,148,92,.22) 70%)}
.letter .sig{margin-top:26px;text-align:right;font-size:15px;color:var(--muted)}
.letter .sig b{font-size:20px;font-weight:800;margin-left:6px;background:none;letter-spacing:.06em}
.why h3{font-size:19.5px}
/* 사례 더 보기, 후기 더 보기 */
details>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:11px 20px;border:1px solid #C9D3D8;border-radius:999px;font-weight:700;font-size:15px;color:var(--brand);background:#fff}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-3px)}
details[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
details[open]>summary{margin-bottom:14px}
details>summary:hover{border-color:var(--brand)}
/* 후기 */
.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:6px}
.score div{background:var(--tint);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.score b{font-size:30px;font-weight:800;color:var(--brand);letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums}
.score b small{font-size:16px;margin-left:2px}
.score span{font-size:14px;color:var(--muted);font-weight:600}
.score-note{margin-bottom:18px}
.rvs{columns:3 300px;column-gap:14px}
.rv{break-inside:avoid;margin:0 0 14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px}
.rv .stars{color:#F2A93B;font-size:15px;letter-spacing:2px}
.rv blockquote{font-size:15.5px;line-height:1.75;color:#2F3B43}
.rv figcaption{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.rv figcaption b{color:var(--ink);font-size:14.5px}
.rv.sm{background:var(--paper);padding:18px 20px 14px}
.rv.sm blockquote{font-size:15px}
/* 감사원, 방송 */
.rec{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);grid-template-rows:auto auto;gap:14px}
.rec figure{margin:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.rec img{width:100%;height:100%;object-fit:cover}
.rec .a{grid-row:span 2}
.rec .b,.rec .c{aspect-ratio:16/9}
/* 상담 띠 */
.band .lead{font-size:15.5px;color:rgba(255,255,255,.85);margin:-4px 0 18px;max-width:560px;line-height:1.7}
/* 명함 */
main section.card{margin-top:22px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.card figure{margin:0;width:386px;max-width:100%;border-radius:12px;overflow:hidden;box-shadow:0 18px 36px -24px rgba(24,35,43,.5);border:1px solid var(--line)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:960px){.score{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.rec{grid-template-columns:1fr}.rec .a{grid-row:auto;aspect-ratio:3/4}}
@media (max-width:560px){.letter{padding:28px 22px 24px}.letter p{font-size:16px}.letter::before{top:24px;bottom:24px}.score b{font-size:26px}.rv{padding:20px 18px 16px}}

/* 소개 다짐 */
.letter .pledge{margin-top:26px;padding:18px 22px;border-radius:14px;background:var(--tint);font-size:18.5px;font-weight:800;letter-spacing:-.03em;line-height:1.6;color:var(--brand)}
/* 대표 후기 */
.rv-hl{margin:0 0 18px;position:relative;background:linear-gradient(120deg,#F3F8FA,#FBF7F0);border:1px solid #E3D6C0;border-radius:22px;padding:34px 40px 28px}
.rv-hl::before{content:"\201C";position:absolute;right:28px;top:-26px;font-size:150px;font-weight:800;color:rgba(184,148,92,.22);line-height:1}
.rv-hl .stars{color:#F2A93B;font-size:17px;letter-spacing:3px}
.rv-hl blockquote{position:relative;margin-top:12px;font-size:clamp(18px,2.1vw,22px);font-weight:700;line-height:1.65;letter-spacing:-.025em}
.rv-hl em{font-style:normal;color:var(--brand);background:linear-gradient(transparent 66%,rgba(184,148,92,.3) 66%)}
.rv-hl figcaption{margin-top:14px;font-size:14px;color:var(--muted)}
.rvs{columns:4 240px}
/* 찾아오시는 길 */
.loc{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:stretch}
.loc .map{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--paper);min-height:340px}
.loc .map{position:relative}
.loc .map::before{content:"지도를 불러오는 중입니다";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.loc iframe{position:relative;display:block;width:100%;height:100%;min-height:340px;border:0}
