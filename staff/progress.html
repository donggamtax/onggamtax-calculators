<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>진도체크 | 동감 세무회계</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f5f7f8; --panel:#ffffff; --ink:#1d2a30; --muted:#5f7078; --line:#dbe3e6;
  --accent:#2f5d6e; --accent-ink:#ffffff; --soft:#e6eff2; --warn:#a35a00; --warn-bg:#fff2dc; --ok:#1d7a4d; --ok-bg:#e2f4ea; --bad:#d62d2d;
  --font:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12191c; --panel:#1b2428; --ink:#e7eef0; --muted:#9db0b8; --line:#2f3d43;
  --accent:#7db7cc; --accent-ink:#0f1d23; --soft:#243239; --warn:#f0b35c; --warn-bg:#3a2c14; --ok:#6fcf9b; --ok-bg:#16322a; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;margin:0;padding:12px 16px 40px}
.wrap{max-width:1250px;margin:0 auto}
h1{font-size:21px;margin:6px 0 4px}h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--muted);font-size:12.5px}
.ced .ce input[type=text]{width:180px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}.btn.sm{padding:3px 9px;font-size:12.5px}.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:none;color:var(--muted);padding:3px 10px;border-radius:99px;font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.lst{width:100%;border-collapse:collapse}
.lst button.t{all:unset;cursor:pointer;display:block;padding:12px 10px;font-weight:700;width:100%;box-sizing:border-box}
.lst tr{border-top:1px solid var(--line)}.lst tr:first-child{border-top:0}.lst tr:hover{background:var(--soft)}
.lst td{padding:0 8px;font-size:13.5px;white-space:nowrap}.lst td:first-child{white-space:normal;padding:0}
.bar{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
table.sm,table.tb{border-collapse:collapse;width:auto}
table.sm th,table.sm td,table.tb th,table.tb td{border:1px solid var(--line);padding:4px 8px;font-size:13px;text-align:center;white-space:nowrap}
table.sm th,table.tb th{background:var(--soft);font-weight:500}
table.sm td.l,table.tb td.l{text-align:left}
table.tb{min-width:100%}
table.tb thead th{position:sticky;top:0;z-index:1}
table.tb td{padding:2px 4px}table.tb tr.done td{background:var(--ok-bg)}
table.tb input[type=text],table.tb select{border:0;background:transparent;padding:3px 2px;width:100%}
table.tb input.dt{min-width:92px;width:92px;text-align:center}button.srt{border:0;background:none;color:inherit;font:inherit;font-weight:inherit;cursor:pointer;padding:0 2px;white-space:nowrap}button.srt:hover{text-decoration:underline}table.tb label.alld{cursor:pointer;white-space:nowrap}table.tb input.fe{min-width:90px;width:90px;text-align:right}table.tb input.nt{min-width:170px}table.tb select{min-width:52px}
table.tb input:focus,table.tb select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--bg)}
table.tb .nmc{text-align:left;font-weight:500;min-width:150px;white-space:normal}
.scroll{overflow:auto;max-height:68vh}
.pb{color:var(--ok);font-weight:700}
.err{color:var(--bad)}.ok{color:var(--ok)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:9;padding:16px}
.dlg>div{background:var(--panel);border-radius:10px;padding:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
.dlg textarea{width:100%;min-height:200px;font-size:12.5px}
.st{font-size:12.5px;color:var(--muted)}.st.bad{color:var(--bad);font-weight:700}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <div id="view"><p class="sub">불러오는 중입니다…</p></div>
</div>
<script>
(function(){
"use strict";
var API=(window.STAFF_API||"").replace(/\/$/,""),token=null;
try{token=localStorage.getItem("staff.token")}catch(e){}
function goLogin(){try{sessionStorage.removeItem("staff.clients.light")}catch(e){}(window.top||window).location.href="index.html"}
if(!token||Number(String(token).split(".")[0])<Date.now())goLogin();
function api(action,data){
  if(!API)return Promise.reject(new Error("서버 주소가 설정되지 않았습니다."));
  var tries=/^(clients\.load|progress\.(lists|get))$/.test(action)?3:1,n=0;
  function go(){
    return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action,token:token},data||{}))})
      .then(function(r){return r.json().catch(function(){var x=new Error("서버 응답을 읽지 못했습니다.");x.retry=1;throw x})})
      .then(function(b){if(b.status===401){goLogin();throw new Error("다시 로그인해 주세요.")}if(b.error)throw new Error(b.error);return b},function(e){if(!e.retry&&e.name==="TypeError")e.retry=1;throw e})
      .catch(function(e){if(e.retry&&++n<tries)return new Promise(function(r){setTimeout(r,700*n)}).then(go);throw e});
  }
  return go();
}
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var S={lists:[],clients:[],people:[],cur:null,rows:{},own:"전체",stf:"전체",err:"",msg:"",adding:false,confirmDel:false};
var KIND={vat:"부가세",corp:"법인세",inc:"종합소득세",tax:"세금 예측",biz:"사업장 현황신고"};
var DEF_COLS=[["done","완료","check"],["prio","우선순위","sel"],["type","구분","auto"],["name","상호","auto"],["owner","담당자","auto"],["diff","난도","sel"],["work","작업일","date"],["file","신고일","date"],["appr","결재완료","date"],["deliv","전달일","date"],["note","특이사항","text"],["mail","메일발송","date"],["fee","수수료","num"],["paid","입금여부","date"],["tinv","세금계산서","date"]].map(function(c){return {k:c[0],l:c[1],t:c[2]}});
function cols(){var l=curList();return (l&&l.cols&&l.cols.length)?l.cols:DEF_COLS}
function colOf(k){return cols().filter(function(c){return c.k===k})[0]||{l:k,t:"text"}}

function cById(id){return S.clients.filter(function(c){return c.id===+id})[0]}
function curList(){return S.lists.filter(function(l){return l.id===S.cur})[0]}
function sortLists(a,b){return (b.year-a.year)||(b.ki-a.ki)||((b.sub==="확정")-(a.sub==="확정"))||(a.kind<b.kind?-1:1)}

function loadAll(){
  return Promise.all([api("progress.lists"),api("clients.load",{light:1})]).then(function(r){
    S.lists=(r[0].lists||[]).sort(sortLists);S.canDelete=!!r[0].canDelete;S.clients=r[1].clients||[];S.people=r[1].people||[];
  });
}
function loadRows(id){
  return api("progress.get",{list:id}).then(function(r){var m={};(r.rows||[]).forEach(function(x){m[x.clientId]=x.data||{}});S.rows[id]=m});
}
/* 날짜는 저장은 2026-01-01, 화면은 2026-1-1 로 보이고 입력한다 */
function fmtD(iso){var m=String(iso||"").match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?(+m[2])+"/"+(+m[3]):""}
function fullD(iso){var m=String(iso||"").match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?m[1]+"-"+(+m[2])+"-"+(+m[3]):""}
function pct(a,b){return b?Math.round(a*100/b)+"%":"-"}

/* ── 목록 화면 ── */
function drawLists(){
  var h='<h1>진도체크</h1><p class="sub">신고별 진행 현황입니다. 신고리스트를 누르면 업체별 작업·결재·전달 상황을 보고 고칠 수 있습니다.</p>';
  h+='<div class="panel"><div class="row"><button class="btn" id="newl">+ 새 신고리스트</button><span class="st">'+esc(S.msg)+'</span></div>';
  if(S.adding)h+=newForm();
  if(S.err)h+='<p class="err">'+esc(S.err)+'</p>';
  h+=S.lists.length?'<table class="lst">'+S.lists.map(function(l){
    var p=l.n?Math.round(l.work*100/l.n):0;
    return '<tr><td><button class="t" data-open="'+esc(l.id)+'">'+esc(l.title)+'</button></td><td><span class="bar"><i style="width:'+p+'%"></i></span>작업 '+l.work+'/'+l.n+' ('+pct(l.work,l.n)+')</td><td>결재 '+l.appr+'</td><td>전달 '+l.deliv+'</td></tr>';
  }).join("")+'</table>':'<p class="sub">아직 신고리스트가 없습니다. "+ 새 신고리스트"로 만드세요.</p>';
  h+='</div>';
  $("#view").innerHTML=h;
}
function newForm(){
  var y=new Date().getFullYear();
  return '<div class="row" style="padding:8px;border:1px solid var(--line);border-radius:8px">'+
    '<label>종류 <select id="nk"><option value="vat">부가세</option><option value="corp">법인세</option><option value="inc">종합소득세</option><option value="tax">세금 예측</option><option value="biz">사업장 현황신고</option></select></label>'+
    '<label>연도 <input id="ny" type="number" value="'+y+'" min="2000" max="2100" style="width:84px"></label>'+
    '<span id="nvat"><label>기 <select id="nki"><option>1</option><option selected>2</option></select></label> <label>구분 <select id="nsub"><option>예정</option><option>확정</option></select></label></span>'+
    '<button class="btn" id="mk">만들기</button><button class="btn ghost" id="mkno">취소</button>'+
    '<span class="sub">빈 리스트로 만들어지고, 엑셀에서 붙여넣기로 업체를 넣습니다. 세금 예측과 사업장 현황신고는 연도만 고르면 됩니다.</span></div>';
}
function eligible(l){
  return S.clients.filter(function(c){
    if((c.status||"거래중")!=="거래중")return false;
    if(l.kind==="vat")return !c.tf&&(l.sub==="확정"||c.type==="법인");
    if(l.kind==="corp")return c.type==="법인";
    if(l.kind==="tax")return true;
    if(l.kind==="biz")return !!c.tf&&c.type!=="법인";
    return c.type!=="법인";
  });
}

/* ── 신고리스트 화면 ── */
function joined(){
  var m=S.rows[S.cur]||{},out=[];
  Object.keys(m).forEach(function(id){var c=cById(id);if(c)out.push({c:c,d:m[id]})});
  var po={"상":0,"중":1,"하":2};
  out.sort(function(a,b){return String(a.c.owner||"~").localeCompare(String(b.c.owner||"~"),"ko")||((po[a.d.prio]==null?3:po[a.d.prio])-(po[b.d.prio]==null?3:po[b.d.prio]))||a.c.name.localeCompare(b.c.name,"ko")});
  return out;
}
function summary(rows){
  var ps=S.people.slice(),extra={};rows.forEach(function(r){var o=r.c.owner||"(미지정)";if(S.people.indexOf(o)<0)extra[o]=1});
  ps=ps.concat(Object.keys(extra));
  var tot={n:0,w:0,a:0,d:0},h='<table class="sm"><tr><th>담당자</th><th>개수</th><th>작업완료</th><th>진행률</th><th>결재완료</th><th>전달완료</th><th>잔여</th></tr>';
  ps.forEach(function(p){
    var rs=rows.filter(function(r){return (r.c.owner||"(미지정)")===p});if(!rs.length)return;
    var w=rs.filter(function(r){return r.d.work}).length,a=rs.filter(function(r){return r.d.appr}).length,d=rs.filter(function(r){return r.d.deliv}).length;
    tot.n+=rs.length;tot.w+=w;tot.a+=a;tot.d+=d;
    h+='<tr><td class="l">'+esc(p)+'</td><td>'+rs.length+'</td><td>'+w+'</td><td class="pb">'+pct(w,rs.length)+'</td><td>'+a+'</td><td>'+d+'</td><td>'+(rs.length-w)+'</td></tr>';
  });
  h+='<tr><th>합계</th><th>'+tot.n+'</th><th>'+tot.w+'</th><th>'+pct(tot.w,tot.n)+'</th><th>'+tot.a+'</th><th>'+tot.d+'</th><th>'+(tot.n-tot.w)+'</th></tr></table>';
  return h;
}
function fmtM(v){var n=String(v||"").replace(/[^\d]/g,"");return n?Number(n).toLocaleString("ko-KR"):""}
function cell(r,col){
  var k=col.k,t=col.t,d=r.d,v=d[k]||"",id=r.c.id,al=esc(col.l);
  if(k==="type")return '<td>'+esc(r.c.type||"개인")+'</td>';
  if(k==="name")return '<td class="nmc">'+esc(r.c.name)+'</td>';
  if(k==="owner")return '<td>'+esc(r.c.owner||"")+'</td>';
  if(t==="check")return '<td><input type="checkbox" data-f="'+k+'" data-id="'+id+'"'+(v?" checked":"")+' aria-label="'+al+'"></td>';
  if(t==="sel"){var o=["","상","중","하"];if(v&&o.indexOf(v)<0)o.push(v);return '<td><select data-f="'+k+'" data-id="'+id+'" aria-label="'+al+'">'+o.map(function(x){return '<option'+(x===v?" selected":"")+'>'+esc(x)+'</option>'}).join("")+'</select></td>'}
  if(t==="num")return '<td><input type="text" class="fe" inputmode="numeric" autocomplete="off" placeholder="금액" data-money="1" data-f="'+k+'" data-id="'+id+'" value="'+esc(fmtM(v))+'" aria-label="'+al+'"></td>';
  if(t==="date")return '<td><input type="text" class="dt" inputmode="numeric" autocomplete="off" data-date="1" data-f="'+k+'" data-id="'+id+'" title="'+esc(fullD(v))+'" value="'+esc(fmtD(v))+'" aria-label="'+al+'"></td>';
  return '<td><input type="text" class="nt" data-f="'+k+'" data-id="'+id+'" value="'+esc(v)+'" aria-label="'+al+'"></td>';
}
function colEditor(){
  var cs=cols(),TY=[["text","글"],["date","날짜"],["num","금액"],["check","체크"]];
  var h='<div class="panel ced"><div class="row"><b>열 편집</b><span class="sub">이름을 바꾸거나, 순서를 옮기거나, 지우거나, 새 열을 추가할 수 있습니다. 열을 지워도 입력해 둔 값은 남아 있고, 같은 열을 다시 만들 때까지 보이지 않을 뿐입니다.</span></div>';
  cs.forEach(function(c,i){
    var fixed=c.k==="name";
    h+='<div class="row ce"><input type="text" data-cl="'+i+'" value="'+esc(c.l)+'" maxlength="20" aria-label="열 이름"><span class="sub">'+({check:"체크",sel:"상중하",text:"글",date:"날짜",num:"금액",auto:"자동"}[c.t]||"")+'</span>'+
      '<button class="btn ghost sm" data-cmv="'+i+'" data-d="-1"'+(i?"":" disabled")+' aria-label="앞으로">↑</button><button class="btn ghost sm" data-cmv="'+i+'" data-d="1"'+(i<cs.length-1?"":" disabled")+' aria-label="뒤로">↓</button>'+
      (fixed?'<span class="sub">(필수)</span>':'<button class="btn ghost sm" data-cdel="'+i+'">지우기</button>')+'</div>';
  });
  h+='<div class="row"><input type="text" id="cnn" placeholder="새 열 이름" maxlength="20"><select id="cnt">'+TY.map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>'}).join("")+'</select><button class="btn sm" id="cadd">열 추가</button><button class="btn ghost sm" id="creset">기본 열로 되돌리기</button><button class="btn sm" id="cdone">닫기</button></div></div>';
  return h;
}
function saveCols(next){
  var l=curList();if(!l)return;var old=l.cols;l.cols=next;S.err="";draw();say("저장 중…");
  api("progress.cols",{id:l.id,cols:next}).then(function(r){l.cols=r.cols;say("열 구성을 저장했습니다.")},function(e){l.cols=old;draw();say(e.message,true)});
}
function nextCk(){
  var used={};cols().forEach(function(c){used[c.k]=1});
  var m=S.rows[S.cur]||{};Object.keys(m).forEach(function(id){Object.keys(m[id]).forEach(function(k){used[k]=1})});
  for(var n=1;n<1000;n++)if(!used["c"+n])return "c"+n;
}
function drawList(){
  var l=curList();if(!l){S.cur=null;return drawLists()}
  var all=joined(),shown=shownRows();
  var owners=["전체"].concat(S.people);
  var h='<div class="row"><button class="btn ghost sm" id="back">← 신고리스트 목록</button><span class="st" id="st">'+esc(S.msg)+'</span></div><h1>'+esc(l.title)+'</h1>';
  h+='<div class="panel">'+summary(all)+'</div>'+(S.edit?colEditor():"");
  h+='<div class="panel"><div class="row">'+owners.map(function(o){return '<button class="chip" data-own="'+esc(o)+'" aria-pressed="'+(S.own===o)+'">'+esc(o)+'</button>'}).join("")+
     '<span class="sub">|</span>'+["전체","미완료","완료"].map(function(o){return '<button class="chip" data-stf="'+o+'" aria-pressed="'+(S.stf===o)+'">'+o+'</button>'}).join("")+
     '<span class="sub">'+shown.length+'곳 · 수수료 합계 '+fmtM(shown.reduce(function(a,r){return a+(Number(r.d.fee)||0)},0)||"0")+'원</span></div>';
  h+='<div class="scroll"><table class="tb"><thead><tr>'+cols().map(function(c){var on=S.sort&&S.sort.k===c.k,b='<button class="srt" data-sort="'+c.k+'" title="누를 때마다 오름차순/내림차순">'+esc(c.l)+'<span>'+(on?(S.sort.dir>0?" ▲":" ▼"):"")+'</span></button>';return c.k==="done"?'<th><label class="alld" title="보이는 업체 전체 체크/해제"><input type="checkbox" id="alldone"'+(shown.length&&shown.every(function(r){return r.d.done})?" checked":"")+' aria-label="전체 완료 체크"></label>'+b+'</th>':'<th>'+b+'</th>'}).join("")+'<th></th></tr></thead><tbody>'+
    (shown.length?shown.map(function(r){return '<tr class="'+(r.d.deliv||r.d.done?"done":"")+'">'+cols().map(function(c){return cell(r,c)}).join("")+'<td><button class="btn ghost sm" data-rm="'+r.c.id+'" title="이 신고리스트에서 빼기">빼기</button></td></tr>'}).join(""):'<tr><td colspan="'+(cols().length+1)+'" class="sub" style="padding:16px">해당하는 업체가 없습니다. 아래의 "엑셀에서 붙여넣기"로 업체를 넣어 주세요.</td></tr>')+
    '</tbody></table></div>';
  h+='<div class="row"><label>업체 추가 <input id="addn" list="addl" placeholder="업체명" autocomplete="off"></label><datalist id="addl">'+
    S.clients.filter(function(c){return (c.status||"거래중")==="거래중"&&!(S.rows[S.cur]||{})[c.id]}).map(function(c){return '<option value="'+esc(c.name)+'">'}).join("")+'</datalist>'+
    '<button class="btn sm" id="addb">추가</button><button class="btn ghost sm" id="auto">대상 업체 자동으로 채우기</button><button class="btn ghost sm" id="imp">엑셀에서 붙여넣기</button><button class="btn ghost sm" id="cedit">열 편집</button>'+
    (!S.canDelete?'':S.confirmDel?'<span class="err">이 신고리스트와 기록이 모두 사라집니다.</span><button class="btn danger sm" id="delyes">삭제 확인</button><button class="btn ghost sm" id="delno">취소</button>':'<button class="btn ghost sm" id="del">이 신고리스트 삭제…</button>')+'</div>';
  if(l.kind==="vat")h+='<p class="sub">업체별 기장의 부가세 신고 체크리스트에서 <b>작성자 결재</b>를 체크하면 작업일이, <b>대표세무사 결재</b>를 체크하면 결재완료 날짜가 이 표에 자동으로 찍힙니다(체크리스트 이름이 "'+l.year+'년 '+l.ki+'기 '+esc(l.sub)+'"으로 시작해야 합니다). 날짜는 여기서 직접 고쳐도 됩니다.</p>';
  h+='</div>';
  if(S.err)h+='<p class="err">'+esc(S.err)+'</p>';
  $("#view").innerHTML=h;
}
function draw(){S.cur?drawList():drawLists()}
function say(t,bad){S.msg=t;var e=$("#st");if(e){e.textContent=t;e.className="st"+(bad?" bad":"")}}
function refreshCounts(){var l=curList();if(!l)return;var m=S.rows[l.id]||{},ids=Object.keys(m);l.n=ids.length;l.work=ids.filter(function(i){return m[i].work}).length;l.appr=ids.filter(function(i){return m[i].appr}).length;l.deliv=ids.filter(function(i){return m[i].deliv}).length}

function openList(id){
  S.cur=id;S.own="전체";S.stf="전체";S.sort=null;S.err="";S.msg="";S.confirmDel=false;
  $("#view").innerHTML='<p class="sub">불러오는 중입니다…</p>';
  loadRows(id).then(draw,function(e){S.err=e.message;draw()});
}
function save(id,field,value,el){
  var m=S.rows[S.cur]||(S.rows[S.cur]={}),old=(m[id]||{})[field]||"",patch={};patch[field]=value;
  (m[id]=m[id]||{});if(value)m[id][field]=value;else delete m[id][field];
  say("저장 중…");
  api("progress.save",{list:S.cur,clientId:+id,patch:patch}).then(function(r){m[id]=r.data||m[id];refreshCounts();say("저장했습니다.");var keep=document.activeElement;var st=$(".scroll");var top=st?st.scrollTop:0;var ae=keep&&keep.dataset?keep.dataset.id+"|"+keep.dataset.f:null;
    /* 요약과 줄 색만 다시 그린다: 입력 중인 칸을 건드리지 않도록 전체를 다시 그리지 않는다 */
    var l=curList(),all=joined();var sm=$(".panel .sm");if(sm)sm.outerHTML=summary(all);
    var ad=$("#alldone");if(ad){var sid=shownIds();ad.checked=sid.length>0&&sid.every(function(x){return !!(m[x]||{}).done})}
    var tr=el&&el.closest("tr");if(tr)tr.className=(m[id].deliv||m[id].done)?"done":"";
  },function(e){if(m[id]){if(old)m[id][field]=old;else delete m[id][field]}if(el){if(el.type==="checkbox")el.checked=!!old;else el.value=el.dataset.date?fmtD(old):el.dataset.money?fmtM(old):old}say(e.message,true)});
}

var PR_ORD={"상":1,"중":2,"하":3};
function sortVal(r,col){
  var k=col.k,t=col.t;
  if(k==="type")return r.c.type||"개인";
  if(k==="name")return r.c.name||"";
  if(k==="owner")return r.c.owner||"";
  var v=r.d[k]||"";
  if(t==="check")return v?1:0;
  if(t==="sel")return PR_ORD[v]||(v?9:"");
  if(t==="num")return v===""?"":Number(v)||0;
  return v;
}
function shownRows(){
  var rows=joined().filter(function(r){
    if(S.own!=="전체"&&(r.c.owner||"(미지정)")!==S.own)return false;
    if(S.stf==="미완료")return !r.d.done&&!r.d.deliv;
    if(S.stf==="완료")return !!(r.d.done||r.d.deliv);
    return true;
  });
  if(S.sort){
    var col=cols().filter(function(c){return c.k===S.sort.k})[0],dir=S.sort.dir;
    if(col)rows=rows.map(function(r,i){return {r:r,i:i,v:sortVal(r,col)}}).sort(function(x,y){
      var xe=x.v===""||x.v===undefined,ye=y.v===""||y.v===undefined;
      if(xe||ye)return xe&&ye?x.i-y.i:(xe?1:-1);
      var c=typeof x.v==="number"&&typeof y.v==="number"?x.v-y.v:String(x.v).localeCompare(String(y.v),"ko");
      return c?c*dir:x.i-y.i;
    }).map(function(o){return o.r});
  }
  return rows;
}
function shownIds(){return shownRows().map(function(r){return String(r.c.id)})}
function bulkDone(ids,on){
  var m=S.rows[S.cur]||(S.rows[S.cur]={}),old={};
  ids=ids.filter(function(id){return !!(m[id]||{}).done!==on});if(!ids.length)return;
  ids.forEach(function(id){old[id]=(m[id]||{}).done||"";(m[id]=m[id]||{});if(on)m[id].done="1";else delete m[id].done});
  refreshCounts();draw();say("저장 중…");
  api("progress.import",{list:S.cur,items:ids.map(function(id){return {clientId:+id,data:{done:on?"1":""}}})}).then(function(){say(ids.length+"곳을 "+(on?"완료로 체크":"체크 해제")+"했습니다.")},function(e){ids.forEach(function(id){if(old[id])m[id].done=old[id];else delete m[id].done});refreshCounts();draw();say(e.message,true)});
}

/* ── 엑셀 붙여넣기 ── */
function normName(s){return String(s||"").replace(/\s+/g,"").replace(/\(주\)|㈜/g,"주식회사").toLowerCase()}
function parseDate(s){
  s=String(s||"").trim();if(!s)return "";
  var m=s.match(/^(\d{4})[-./]\s*(\d{1,2})[-./]\s*(\d{1,2})/);
  if(!m){var m2=s.match(/^(\d{2})[-./]\s*(\d{1,2})[-./]\s*(\d{1,2})$/);if(m2)m=[0,"20"+m2[1],m2[2],m2[3]]}
  if(!m){var m3=s.match(/^(\d{1,2})[-./월]\s*(\d{1,2})일?$/);if(m3)m=[0,String(new Date().getFullYear()),m3[1],m3[2]]}
  if(!m)return null;
  var y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return null;
  return y+"-"+("0"+mo).slice(-2)+"-"+("0"+d).slice(-2);
}
function parsePaste(text){
  var lines=text.replace(/\r/g,"").split("\n").filter(function(x){return x.trim()!==""}).map(function(x){return x.split("\t")});
  var hi=-1;lines.forEach(function(r,i){if(hi<0&&r.some(function(c){return c.trim()==="상호"}))hi=i});
  if(hi<0)return {error:'머리글 줄(상호, 담당자, 작업일 …)이 함께 붙여넣어져야 합니다. 엑셀에서 "완료여부 / 우선순위 … " 머리글 줄부터 복사하세요.'};
  var head=lines[hi].map(function(x){return x.trim()}),ix=function(n){return head.indexOf(n)};
  var map={};cols().forEach(function(c){if(c.t==="auto")return;var i=ix(c.l);if(i<0&&c.k==="done")i=ix("완료여부");if(i>=0)map[c.k]=i});var ni=ix("상호");
  var byName={};S.clients.forEach(function(c){byName[normName(c.name)]=c});
  var items=[],miss=[],baddate=0;
  lines.slice(hi+1).forEach(function(r){
    var nm=(r[ni]||"").trim();if(!nm)return;
    var c=byName[normName(nm)];if(!c){miss.push(nm);return}
    var d={};
    Object.keys(map).forEach(function(k){
      var v=(r[map[k]]||"").trim();if(!v)return;var t=colOf(k).t;
      if(t==="check")d[k]=/^(x|n|no|false|0|미완료)$/i.test(v)?"":"1";
      else if(t==="date"){var dt=parseDate(v);if(dt)d[k]=dt;else baddate++}
      else if(t==="num"){var fm=String(v).replace(/[^\d]/g,"");if(fm)d[k]=fm}
      else d[k]=v;
    });
    items.push({clientId:c.id,data:d});
  });
  return {items:items,miss:miss,baddate:baddate};
}
function importDlg(){
  var m=document.createElement("div");m.className="dlg";
  m.innerHTML='<div><h2>엑셀에서 붙여넣기</h2><p class="sub">엑셀의 표를 머리글 줄(완료여부, 우선순위, 상호, 담당자 …)부터 복사해 아래에 붙여넣으세요. 상호가 업체 목록과 같은 줄만 들어가고, 이미 있는 업체는 붙여넣은 내용으로 덮어씁니다(빈 칸은 그대로 둡니다). 담당자와 구분은 업체 정보를 따릅니다.</p><textarea id="pt" placeholder="여기에 붙여넣기"></textarea><p class="sub">머리글은 이 표의 열 이름과 같게 적으세요(<b id="phn"></b>). 필요한 열만 있으면 되고 상호는 꼭 필요합니다. 날짜는 6/11 형식, 금액은 숫자, 체크 열은 O(또는 아무 글자)를 적으면 체크됩니다. 구분·담당자는 업체 정보를 따르니 열이 있어도 무시합니다.</p><p class="sub" id="pi"></p><div class="row"><button class="btn ghost" id="ptpl">양식 받기(CSV)</button><button class="btn" id="pgo">넣기</button><button class="btn ghost" id="pno">닫기</button></div></div>';
  document.body.appendChild(m);
  m.querySelector("#phn").textContent=cols().filter(function(c){return c.t!=="auto"||c.k==="name"}).map(function(c){return c.l}).join(", ");var ta=m.querySelector("#pt"),pi=m.querySelector("#pi"),res=null;
  ta.addEventListener("input",function(){res=parsePaste(ta.value);pi.className=res.error?"err":"sub";pi.textContent=res.error?res.error:res.items.length+"곳을 넣습니다."+(res.miss.length?" 업체 목록에서 못 찾은 상호 "+res.miss.length+"곳: "+res.miss.slice(0,6).join(", ")+(res.miss.length>6?" …":""):"")+(res.baddate?" (읽지 못한 날짜 "+res.baddate+"칸은 건너뜀)":"")});
  m.addEventListener("click",function(e){
    if(e.target===m||e.target.id==="pno")return m.remove();
    if(e.target.id==="ptpl"){
      var hs=cols().map(function(c){return c.l}),ex=cols().map(function(c){return c.k==="name"?"예시상사":c.t==="date"&&c.k==="work"?"2026-10-16":c.t==="num"?"150000":c.t==="check"?"O":""});
      var csv="\ufeff"+hs.map(function(x){return '"'+x.replace(/"/g,'""')+'"'}).join(",")+"\r\n"+ex.join(",")+"\r\n";
      var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="신고리스트_업로드양식.csv";document.body.appendChild(a);a.click();a.remove();return;
    }
    if(e.target.id==="pgo"){
      if(!res||res.error||!res.items.length)return;
      e.target.disabled=true;pi.textContent="넣는 중입니다…";
      api("progress.add",{list:S.cur,ids:res.items.map(function(x){return x.clientId})}).then(function(){return api("progress.import",{list:S.cur,items:res.items})})
        .then(function(){m.remove();return loadRows(S.cur)}).then(function(){refreshCounts();S.msg="붙여넣은 "+res.items.length+"곳을 반영했습니다.";draw()},function(x){pi.className="err";pi.textContent=x.message;e.target.disabled=false});
    }
  });
}

/* ── 이벤트 ── */
document.addEventListener("click",function(e){
  var t=e.target,b;
  if(t.id==="newl"){S.adding=true;drawLists();return}
  if(t.id==="mkno"){S.adding=false;drawLists();return}
  if(t.id==="mk"){
    var kind=$("#nk").value,year=+$("#ny").value,ki=+$("#nki").value,sub=$("#nsub").value;t.disabled=true;
    api("progress.listSave",{kind:kind,year:year,ki:ki,sub:sub}).then(function(l){
      S.adding=false;return loadAll().then(function(){openList(l.id)});
    }).catch(function(x){S.err=x.message;drawLists()});
    return;
  }
  if((b=t.closest("[data-open]")))return openList(b.dataset.open);
  if(t.id==="back"){S.cur=null;S.err="";loadAll().then(draw,draw);draw();return}
  if((b=t.closest("[data-sort]"))){var sk=b.dataset.sort;S.sort=(S.sort&&S.sort.k===sk)?{k:sk,dir:-S.sort.dir}:{k:sk,dir:1};return draw()}
  if(t.id==="cedit"){S.edit=!S.edit;return draw()}
  if(t.id==="cdone"){S.edit=false;return draw()}
  if((b=t.closest("[data-cmv]"))){var i=+b.dataset.cmv,dd=+b.dataset.d,n=cols().slice(),x=n[i];n.splice(i,1);n.splice(i+dd,0,x);return saveCols(n)}
  if((b=t.closest("[data-cdel]"))){var n2=cols().slice();n2.splice(+b.dataset.cdel,1);return saveCols(n2)}
  if(t.id==="cadd"){var nm=($("#cnn").value||"").trim();if(!nm)return say("새 열 이름을 적어 주세요.",true);return saveCols(cols().concat([{k:nextCk(),l:nm,t:$("#cnt").value}]))}
  if(t.id==="creset"){return saveCols(DEF_COLS.slice())}
  if((b=t.closest("[data-own]"))){S.own=b.dataset.own;return draw()}
  if((b=t.closest("[data-stf]"))){S.stf=b.dataset.stf;return draw()}
  if((b=t.closest("[data-rm]"))){
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="한 번 더";return}
    var id=b.dataset.rm;b.disabled=true;
    api("progress.remove",{list:S.cur,clientId:+id}).then(function(){delete S.rows[S.cur][id];refreshCounts();draw()},function(x){say(x.message,true);b.disabled=false});
    return;
  }
  if(t.id==="addb"){
    var nm=$("#addn").value.trim(),c=S.clients.filter(function(x){return normName(x.name)===normName(nm)})[0];
    if(!c)return say("업체명을 목록에서 골라 주세요.",true);
    api("progress.add",{list:S.cur,ids:[c.id]}).then(function(){S.rows[S.cur][c.id]=S.rows[S.cur][c.id]||{};refreshCounts();draw()},function(x){say(x.message,true)});
    return;
  }
  if(t.id==="auto"){
    var l=curList(),ids=eligible(l).map(function(c){return c.id}).filter(function(i){return !S.rows[S.cur][i]});
    if(!ids.length)return say("더할 업체가 없습니다.");
    api("progress.add",{list:S.cur,ids:ids}).then(function(){ids.forEach(function(i){S.rows[S.cur][i]={}});refreshCounts();S.msg=ids.length+"곳을 더했습니다.";draw()},function(x){say(x.message,true)});
    return;
  }
  if(t.id==="imp")return importDlg();
  if(t.id==="del"){S.confirmDel=true;return draw()}
  if(t.id==="delno"){S.confirmDel=false;return draw()}
  if(t.id==="delyes"){t.disabled=true;api("progress.listDelete",{id:S.cur}).then(function(){S.cur=null;S.confirmDel=false;return loadAll()}).then(draw,function(x){S.err=x.message;draw()});return}
});
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f==="done"&&t.dataset.id)S.shift=e.shiftKey;
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.cl!==undefined){var nm2=t.value.trim(),n3=cols().map(function(c){return {k:c.k,l:c.l,t:c.t}}),ci=+t.dataset.cl;if(!nm2){t.value=n3[ci].l;return}if(nm2===n3[ci].l)return;n3[ci].l=nm2;return saveCols(n3)}
  if(t.id==="alldone"){bulkDone(shownIds(),t.checked);return}
  if(t.dataset&&t.dataset.f==="done"&&t.dataset.id){
    var on=t.checked,ids=shownIds(),last=S.lastDone,shift=S.shift;S.shift=false;S.lastDone=t.dataset.id;
    var a=ids.indexOf(last),b=ids.indexOf(t.dataset.id);
    if(shift&&a>=0&&b>=0&&a!==b){bulkDone(ids.slice(Math.min(a,b),Math.max(a,b)+1),on);return}
  }
  if(t.id==="nk"){$("#nvat").style.display=t.value==="vat"?"":"none";return}
  if(t.dataset&&t.dataset.f&&t.dataset.id){
    var v=t.type==="checkbox"?(t.checked?"1":""):t.value.trim();
    if(t.dataset.money){v=v.replace(/[^\d]/g,"");if(v)v=String(Number(v));t.value=fmtM(v)}
    if(t.dataset.date){
      var dv=parseDate(v);
      if(dv===null){say('날짜는 6/11 처럼 적어 주세요(연도까지 쓰려면 2026-6-11).',true);t.value=fmtD(((S.rows[S.cur]||{})[t.dataset.id]||{})[t.dataset.f]);return}
      v=dv;t.value=fmtD(dv);t.title=fullD(dv);
    }
    save(t.dataset.id,t.dataset.f,v,t);
  }
});

loadAll().then(draw,function(e){$("#view").innerHTML='<p class="err">'+esc(e.message)+'</p>'});
})();
</script>
