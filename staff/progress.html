<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>진도체크 | 동감 세무회계</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f5f7f8; --panel:#ffffff; --ink:#1d2a30; --muted:#5f7078; --line:#dbe3e6;
  --accent:#2f5d6e; --accent-ink:#ffffff; --soft:#e6eff2; --warn:#a35a00; --warn-bg:#fff2dc; --ok:#1d7a4d; --ok-bg:#e2f4ea; --bad:#d62d2d;
  --font:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12191c; --panel:#1b2428; --ink:#e7eef0; --muted:#9db0b8; --line:#2f3d43;
  --accent:#7db7cc; --accent-ink:#0f1d23; --soft:#243239; --warn:#f0b35c; --warn-bg:#3a2c14; --ok:#6fcf9b; --ok-bg:#16322a; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;margin:0;padding:12px 16px 40px}
.wrap{max-width:none;margin:0 auto}
h1{font-size:21px;margin:6px 0 4px}h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--muted);font-size:12.5px}
.ced .ce input[type=text]{width:180px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.nts{margin:4px 0 0;padding-left:22px}.nts li{margin:2px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}.btn.sm{padding:3px 9px;font-size:12.5px}.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:none;color:var(--muted);padding:3px 10px;border-radius:99px;font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.lst{width:100%;border-collapse:collapse}
.lst button.t{all:unset;cursor:pointer;display:block;padding:12px 10px;font-weight:700;width:100%;box-sizing:border-box}
.lst tr{border-top:1px solid var(--line)}.lst tr:first-child{border-top:0}.lst tr:hover{background:var(--soft)}
.lst td{padding:0 8px;font-size:13.5px;white-space:nowrap}.lst td:first-child{white-space:normal;padding:0}
.bar{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.sumrow{display:flex;gap:18px;align-items:stretch;flex-wrap:wrap}.sumrow>.sumtab{flex:none;overflow-x:auto;max-width:100%}
.trk{flex:1;min-width:300px;border:1px solid var(--line);border-radius:10px;padding:8px 12px 6px;background:linear-gradient(var(--soft),transparent 70%)}
.trk h4{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--accent);display:flex;justify-content:space-between;align-items:baseline}.trk h4 span{font-size:11.5px;font-weight:400;color:var(--muted,#667)}
.lane{display:flex;align-items:center;gap:8px;height:58px}.lane .nm{flex:none;width:58px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.lane .rd{position:relative;flex:1;height:100%;border-bottom:2px dashed var(--line);margin-right:30px}
.lane .rd::before{content:"";position:absolute;left:0;top:6px;bottom:-2px;border-left:2px solid var(--line)}
.lane .fl{position:absolute;right:-30px;bottom:-3px;font-size:22px;line-height:1}
.lane .rn{position:absolute;left:0;bottom:-2px;width:44px;text-align:center;transition:left 1.2s cubic-bezier(.3,1.3,.5,1);will-change:left}
.lane .rn .ch{display:block;width:44px;height:52px}.ch svg{display:block;overflow:visible}.lane.run .rn .ch{animation:hop .36s ease-in-out infinite}
.lane .rn .pc{position:absolute;left:46px;top:18px;font-size:10px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 5px;white-space:nowrap}
.lane .rn .cr{position:absolute;left:50%;top:-16px;transform:translateX(-50%) rotate(-12deg);font-size:14px}
.lane .rn .ds{position:absolute;right:38px;bottom:10px;font-size:11px;opacity:.55}
.lane .rn.late .pc{left:auto;right:46px}
.lane.fin .rn .ch{animation:cheer .8s ease-in-out infinite}
.ch .arm,.ch .leg{transform-box:view-box}.ch .sw,.ch .mo-ok{display:none}
.lane.run .ch .a1{animation:swA .36s ease-in-out infinite alternate}.lane.run .ch .a2{animation:swA .36s ease-in-out infinite alternate-reverse}
.lane.run .ch .l1{animation:swL .36s ease-in-out infinite alternate}.lane.run .ch .l2{animation:swL .36s ease-in-out infinite alternate-reverse}
.lane.run .ch .sw{display:block;animation:drop .9s ease-in infinite}.lane.run .ch .s2{animation-delay:.45s}
.lane.run .ch svg{transform:rotate(7deg);transform-origin:50% 100%}
.lane.fin .ch .a1{transform:rotate(105deg)}.lane.fin .ch .a2{transform:rotate(-105deg)}.lane.fin .ch .mo-run,.lane.fin .ch .tr{display:none}.lane.fin .ch .mo-ok{display:block}
@keyframes swA{from{transform:rotate(-45deg)}to{transform:rotate(45deg)}}
@keyframes swL{from{transform:rotate(-38deg)}to{transform:rotate(38deg)}}
@keyframes drop{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(3px,14px);opacity:0}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes cheer{0%,100%{transform:scale(1)}50%{transform:scale(1.25) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.lane .rn{transition:none}.lane.run .rn .ch,.lane.fin .rn .ch,.lane .ch *{animation:none!important}}
table.sm,table.tb{border-collapse:collapse;width:auto}
table.sm th,table.sm td,table.tb th,table.tb td{border:1px solid var(--line);padding:4px 8px;font-size:13px;text-align:center;white-space:nowrap}
table.sm th,table.tb th{background:var(--soft);font-weight:500}
table.sm td.l,table.tb td.l{text-align:left}
table.tb{table-layout:fixed;min-width:0;width:auto}table.tb th{overflow:hidden;text-overflow:ellipsis;position:relative}table.tb td{overflow:hidden;scroll-margin-top:34px}table.tb td:focus{outline:none}.rz{position:absolute;top:0;right:-3px;bottom:0;width:8px;cursor:col-resize;z-index:3}.rz:hover,.rz.on{background:var(--accent);opacity:.35}table.tb td.sel{background:rgba(47,93,110,.16)!important}table.tb td.act{box-shadow:inset 0 0 0 2px var(--accent)}table.tb.selmode,table.tb.selmode *{user-select:none;-webkit-user-select:none}
table.tb thead th{position:sticky;top:0;z-index:1}
table.tb td{padding:2px 4px}table.tb tr.done td{background:var(--ok-bg)}
table.tb input[type=text],table.tb select{border:0;background:transparent;padding:3px 2px;width:100%}
table.tb input.dt{text-align:center}table.tb input.dt.rej{color:#d62d2d;font-weight:800}button.srt{border:0;background:none;color:inherit;font:inherit;font-weight:inherit;cursor:pointer;padding:0 2px;white-space:nowrap}button.srt:hover{text-decoration:underline}table.tb label.alld{cursor:pointer;white-space:nowrap}table.tb input.fe{text-align:right}
table.tb input:focus,table.tb select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--bg)}
table.tb .nmc{text-align:left;font-weight:500;white-space:normal}
.scroll{overflow:auto;max-height:80vh}
.pb{color:var(--ok);font-weight:700}
.err{color:var(--bad)}.ok{color:var(--ok)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:9;padding:16px}
.dlg>div{background:var(--panel);border-radius:10px;padding:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
.dlg textarea{width:100%;min-height:200px;font-size:12.5px}
.st{font-size:12.5px;color:var(--muted)}.st.bad{color:var(--bad);font-weight:700}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <div id="view"><p class="sub">불러오는 중입니다…</p></div>
</div>
<script>
(function(){
"use strict";
var API=(window.STAFF_API||"").replace(/\/$/,""),token=null;
try{token=localStorage.getItem("staff.token")}catch(e){}
function goLogin(){try{sessionStorage.removeItem("staff.clients.light")}catch(e){}(window.top||window).location.href="index.html"}
if(!token||Number(String(token).split(".")[0])<Date.now())goLogin();
function api(action,data){
  if(!API)return Promise.reject(new Error("서버 주소가 설정되지 않았습니다."));
  var tries=/^(clients\.load|progress\.(lists|get))$/.test(action)?3:1,n=0;
  function go(){
    return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action,token:token},data||{}))})
      .then(function(r){return r.json().catch(function(){var x=new Error("서버 응답을 읽지 못했습니다.");x.retry=1;throw x})})
      .then(function(b){if(b.status===401){goLogin();throw new Error("다시 로그인해 주세요.")}if(b.error)throw new Error(b.error);return b},function(e){if(!e.retry&&e.name==="TypeError")e.retry=1;throw e})
      .catch(function(e){if(e.retry&&++n<tries)return new Promise(function(r){setTimeout(r,700*n)}).then(go);throw e});
  }
  return go();
}
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var S={lists:[],clients:[],people:[],cur:null,rows:{},own:"전체",stf:"전체",err:"",msg:"",adding:false,confirmDel:false};
var G={a:null,f:null,drag:false,moved:false};
var KIND={vat:"부가세",corp:"법인세",inc:"종합소득세",tax:"소득세/법인세 예측",biz:"사업장 현황신고"};
var DEF_COLS=[["done","완료","check"],["prio","우선순위","sel"],["type","구분","auto"],["name","상호","auto"],["owner","담당자","auto"],["diff","난도","sel"],["work","작업일","date"],["file","신고일","date"],["appr","결재완료","date"],["deliv","전달일","date"],["note","특이사항","text"],["mail","메일발송","date"],["fee","수수료","num"],["paid","입금여부","date"],["tinv","세금계산서","date"]].map(function(c){return {k:c[0],l:c[1],t:c[2]}});
var TAX_COLS=[["prio","중요도","sel"],["name","업체명","auto"],["owner","담당자","auto"],["work","추정완료","date"],["c1","상담완료","date"]].map(function(c){return {k:c[0],l:c[1],t:c[2]}});
var TAX_NOTES=["정확하지 않아도 됨","1~8월 매출액 기준, 단 판매대행 있는 경우 1~9월 기준으로 예측","인건비는 전표입력, 매출과 매출원가, 감가상각비는 전표입력 안 해도 됨. 예측 자료에는 반영","매출/매입 확인해서 세금 많이 나올 곳을 우선 작업"];
function isTax(){var l=curList();return !!l&&l.kind==="tax"}
function defCols(){return isTax()?TAX_COLS:DEF_COLS}
/* 소득세/법인세 예측은 추정완료(날짜)가 끝난 표시, 다른 리스트는 완료 체크·전달일 */
function okA(d){return !!d.appr&&d.appr!=="반려"}
function isDone(d){return isTax()?!!d.work:!!(d.deliv||d.done)}
var PRIV={fee:1,paid:1,tinv:1};
function isAdmin(){return !!S.canDelete}
function rawCols(){var l=curList();return (l&&l.cols&&l.cols.length)?l.cols:defCols()}
function cols(){var r=rawCols();return isAdmin()?r:r.filter(function(c){return !PRIV[c.k]})}
/* 수수료 등을 못 보는 사람이 열을 고쳐도 숨은 열은 그대로 유지한다 */
function keepPriv(next){
  if(isAdmin())return next;
  var raw=rawCols(),out=next.filter(function(c){return !PRIV[c.k]});
  raw.forEach(function(c,i){
    if(!PRIV[c.k])return;
    var prev=null;for(var j=i-1;j>=0;j--)if(!PRIV[raw[j].k]){prev=raw[j].k;break}
    var at=prev===null?0:out.map(function(x){return x.k}).indexOf(prev)+1;
    if(prev!==null&&at===0)at=out.length;
    out.splice(at,0,{k:c.k,l:c.l,t:c.t});
  });
  return out;
}
function colOf(k){return cols().filter(function(c){return c.k===k})[0]||{l:k,t:"text"}}

function cById(id){return S.clients.filter(function(c){return c.id===+id})[0]}
function curList(){return S.lists.filter(function(l){return l.id===S.cur})[0]}
function sortLists(a,b){return (b.year-a.year)||(b.ki-a.ki)||((b.sub==="확정")-(a.sub==="확정"))||(a.kind<b.kind?-1:1)}

function loadAll(){
  return Promise.all([api("progress.lists"),api("clients.load",{light:1})]).then(function(r){
    S.lists=(r[0].lists||[]).sort(sortLists);S.canDelete=!!r[0].canDelete;S.clients=r[1].clients||[];S.people=r[1].people||[];
  });
}
function loadRows(id){
  return api("progress.get",{list:id}).then(function(r){var m={};(r.rows||[]).forEach(function(x){m[x.clientId]=x.data||{}});S.rows[id]=m});
}
/* 날짜는 저장은 2026-01-01, 화면은 2026-1-1 로 보이고 입력한다 */
function fmtD(iso){if(iso==="반려")return"반려";var m=String(iso||"").match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?(+m[2])+"/"+(+m[3]):""}
function fullD(iso){if(iso==="반려")return"반려";var m=String(iso||"").match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?m[1]+"-"+(+m[2])+"-"+(+m[3]):""}
function pct(a,b){return b?Math.round(a*100/b)+"%":"-"}

/* ── 목록 화면 ── */
function drawLists(){
  var h='<h1>진도체크</h1><p class="sub">신고별 진행 현황입니다. 신고리스트를 누르면 업체별 작업·결재·전달 상황을 보고 고칠 수 있습니다.</p>';
  h+='<div class="panel"><div class="row"><button class="btn" id="newl">+ 새 신고리스트</button><span class="st">'+esc(S.msg)+'</span></div>';
  if(S.adding)h+=newForm();
  if(S.err)h+='<p class="err">'+esc(S.err)+'</p>';
  h+=S.lists.length?'<table class="lst">'+S.lists.map(function(l){
    var p=l.n?Math.round(l.work*100/l.n):0;
    return '<tr><td><button class="t" data-open="'+esc(l.id)+'">'+esc(l.title)+'</button></td><td><span class="bar"><i style="width:'+p+'%"></i></span>'+(l.kind==="tax"?'추정완료 ':'작업 ')+l.work+'/'+l.n+' ('+pct(l.work,l.n)+')</td>'+(l.kind==="tax"?'':'<td>결재 '+l.appr+'</td><td>전달 '+l.deliv+'</td>')+'</tr>';
  }).join("")+'</table>':'<p class="sub">아직 신고리스트가 없습니다. "+ 새 신고리스트"로 만드세요.</p>';
  h+='</div>';
  $("#view").innerHTML=h;
}
function newForm(){
  var y=new Date().getFullYear();
  return '<div class="row" style="padding:8px;border:1px solid var(--line);border-radius:8px">'+
    '<label>종류 <select id="nk"><option value="vat">부가세</option><option value="corp">법인세</option><option value="inc">종합소득세</option><option value="tax">소득세/법인세 예측</option><option value="biz">사업장 현황신고</option></select></label>'+
    '<label>연도 <input id="ny" type="number" value="'+y+'" min="2000" max="2100" style="width:84px"></label>'+
    '<span id="nvat"><label>기 <select id="nki"><option>1</option><option selected>2</option></select></label> <label>구분 <select id="nsub"><option>예정</option><option>확정</option></select></label></span>'+
    '<button class="btn" id="mk">만들기</button><button class="btn ghost" id="mkno">취소</button>'+
    '<span class="sub">빈 리스트로 만들어지고, 엑셀에서 붙여넣기로 업체를 넣습니다. 소득세/법인세 예측은 연도만 고르면 대상 업체가 모두 들어가고, 사업장 현황신고는 연도만 고르면 됩니다.</span></div>';
}
function eligible(l){
  return S.clients.filter(function(c){
    if((c.status||"거래중")!=="거래중")return false;
    if(l.kind==="vat")return !c.tf&&(l.sub==="확정"||c.type==="법인");
    if(l.kind==="corp")return c.type==="법인";
    if(l.kind==="tax")return true;
    if(l.kind==="biz")return !!c.tf&&c.type!=="법인";
    return c.type!=="법인";
  });
}

/* ── 신고리스트 화면 ── */
function joined(){
  var m=S.rows[S.cur]||{},out=[];
  Object.keys(m).forEach(function(id){var c=+id<0?{id:+id,name:m[id].xn||"(이름 없음)",type:m[id].xt||"개인",owner:m[id].xo||"",extra:true}:cById(id);if(c&&!c.extra&&m[id].xo)c=Object.assign({},c,{owner:m[id].xo,base:c.owner});if(c)out.push({c:c,d:m[id]})});
  var po={"상":0,"중":1,"하":2};
  out.sort(function(a,b){return String(a.c.owner||"~").localeCompare(String(b.c.owner||"~"),"ko")||((po[a.d.prio]==null?3:po[a.d.prio])-(po[b.d.prio]==null?3:po[b.d.prio]))||a.c.name.localeCompare(b.c.name,"ko")});
  return out;
}
/* 달리기 트랙: 담당자별 진행률(작업완료/개수)만큼 캐릭터가 결승선 쪽으로 달린다 */
var SHIRTS=["#e4572e","#17bebb","#f2b705","#76b041","#9b5de5","#f15bb5","#00a6fb","#ff8c42","#4f8a5b","#bc4749"],HAIRS=["#3a2a1a","#1f1f1f","#8a5a2b","#5b3a29","#c9822b"];
function runnerSvg(i){ /* 땀 흘리며 헐레벌떡 뛰는 사람 (달리는 중에만 팔다리가 움직이고 땀이 떨어진다) */
  var sh=SHIRTS[i%SHIRTS.length],hr=HAIRS[i%HAIRS.length],sk="#ffd9b3";
  return '<svg viewBox="0 0 34 40" width="44" height="52" aria-hidden="true">'+
    '<g class="leg l1" style="transform-origin:14px 27px"><line x1="14" y1="27" x2="12" y2="37" stroke="#34495e" stroke-width="3.6" stroke-linecap="round"/></g>'+
    '<g class="leg l2" style="transform-origin:20px 27px"><line x1="20" y1="27" x2="22" y2="37" stroke="#34495e" stroke-width="3.6" stroke-linecap="round"/></g>'+
    '<rect x="10.5" y="16" width="13" height="12" rx="4.5" fill="'+sh+'"/>'+
    '<g class="arm a2" style="transform-origin:23px 18.5px"><line x1="23" y1="18.5" x2="28" y2="26" stroke="'+sk+'" stroke-width="3" stroke-linecap="round"/></g>'+
    '<g class="arm a1" style="transform-origin:11px 18.5px"><line x1="11" y1="18.5" x2="6" y2="26" stroke="'+sk+'" stroke-width="3" stroke-linecap="round"/></g>'+
    '<circle cx="17" cy="9" r="7.5" fill="'+sk+'"/><path d="M9.6 8 Q10 1 17 1.5 Q24 1 24.4 8 Q20 4.5 17 5.5 Q13 4.5 9.6 8z" fill="'+hr+'"/>'+

  if(!m)return null;
  var y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return null;
  return y+"-"+("0"+mo).slice(-2)+"-"+("0"+d).slice(-2);
}

  var map={};cols().forEach(function(c){if(c.t==="auto")return;var i=ix(c.l);if(i<0&&c.k==="done")i=ix("완료여부");if(i>=0)map[c.k]=i});var ni=ix("상호");if(ni<0)ni=ix("업체명");

}

    e.preventDefault();gMove(dr,dc,e.shiftKey&&k!=="Enter");return;
  }
  if((k==="Delete"||k==="Backspace")&&gMulti()){
    e.preventDefault();var g=gRange(),cells=[];
    for(var r=g.r1;r<=g.r2;r++)for(var c=g.c1;c<=g.c2;c++)cells.push({r:r,c:c,v:""});
    gApply(cells);
  }
});
document.addEventListener("copy",function(e){
  if(!gActive(e)||!G.a)return;
  var t=e.target,has=t&&t.selectionStart!=null&&t.selectionStart!==t.selectionEnd;
  if(!gMulti()&&has)return; /* 칸 안의 글자만 복사 */
  e.clipboardData.setData("text/plain",gText());e.preventDefault();say("복사했습니다.");
});
document.addEventListener("paste",function(e){
  if(!gActive(e)||!G.a)return;
  var raw=(e.clipboardData&&e.clipboardData.getData("text/plain"))||"";if(!raw)return;
  var lines=raw.replace(/\r/g,"").split("\n");if(lines.length>1&&lines[lines.length-1]==="")lines.pop();
  var grid=lines.map(function(l){return l.split("\t").map(function(x){return x.replace(/^"(.*)"$/,"$1")})});
  var one=grid.length===1&&grid[0].length===1,g=gRange(),cells=[];
  if(one&&!gMulti())return; /* 한 칸에 한 값: 기본 붙여넣기 */
  e.preventDefault();
  if(one){for(var r=g.r1;r<=g.r2;r++)for(var c=g.c1;c<=g.c2;c++)cells.push({r:r,c:c,v:grid[0][0]})}
  else grid.forEach(function(row,i){row.forEach(function(v,j){cells.push({r:g.r1+i,c:g.c1+j,v:v})})});
  gApply(cells);
});
document.addEventListener("mousedown",function(e){

    var up=function(){document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);rz.classList.remove("on");try{localStorage.setItem(cwKey(),JSON.stringify(S.cw))}catch(x){}};
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);return;

  if(e.button!==0)return;

  var p=gPos(td);if(!p)return;
  if(e.shiftKey&&G.a&&t.type!=="checkbox"){e.preventDefault();G.f=p;gPaint();if(gMulti()&&document.activeElement&&document.activeElement.blur)document.activeElement.blur();return}
  G.a=G.f=p;G.drag=true;G.moved=false;gPaint();
});
document.addEventListener("mousemove",function(e){
  if(!G.drag)return;
  if(!(e.buttons&1)){G.drag=false;return}
  var el=document.elementFromPoint(e.clientX,e.clientY),td=el&&el.closest&&el.closest("table.tb tbody td"),p=td&&gPos(td);
  if(!p||(p.r===G.f.r&&p.c===G.f.c))return;
  if(!G.moved){G.moved=true;var tb=document.querySelector("table.tb");if(tb)tb.classList.add("selmode");if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();var sel=window.getSelection&&window.getSelection();if(sel)sel.removeAllRanges()}
  G.f=p;gPaint();
});

document.addEventListener("focusin",function(e){

});

  if(t.id==="nedit"){S.nedit=true;return draw()}

  if((b=t.closest("[data-ndel]"))){var l1=curList(),n5=notesOf(l1).slice();n5.splice(+b.dataset.ndel,1);S.nedit=true;return saveNotes(n5)}
  if(t.id==="creset"){return saveCols(defCols().slice())}
  if((b=t.closest("[data-own]"))){S.own=b.dataset.own;return draw()}
  if((b=t.closest("[data-stf]"))){S.stf=b.dataset.stf;return draw()}
  if((b=t.closest("[data-rm]"))){
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="한 번 더";return}
    var id=b.dataset.rm;b.disabled=true;
    api("progress.remove",{list:S.cur,clientId:+id}).then(function(){delete S.rows[S.cur][id];refreshCounts();draw()},function(x){say(x.message,true);b.disabled=false});
    return;
  }

    var nm=$("#addn").value.trim(),c=S.clients.filter(function(x){return normName(x.name)===normName(nm)})[0];
    if(!c)return say("업체명을 목록에서 골라 주세요.",true);
    api("progress.add",{list:S.cur,ids:[c.id]}).then(function(){S.rows[S.cur][c.id]=S.rows[S.cur][c.id]||{};refreshCounts();draw()},function(x){say(x.message,true)});
    return;
  }
  if(t.id==="xopen"){S.xform=!S.xform;return draw()}
  if(t.id==="xno"){S.xform=false;return draw()}
  if(t.id==="xgo"){
    var xn=$("#xn").value.trim();if(!xn)return say("상호를 적어 주세요.",true);
    if(S.clients.some(function(x){return normName(x.name)===normName(xn)}))return say("업체별 기장 명단에 있는 업체입니다. 위의 업체 추가에서 골라 주세요.",true);
    if(joined().some(function(r){return normName(r.c.name)===normName(xn)}))return say("이미 이 신고리스트에 있습니다.",true);
