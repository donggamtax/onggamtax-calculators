<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>업체별 기장 | 동감 세무회계</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 왼쪽 업체 목록, 오른쪽 선택한 업체 화면(좁은 화면에서는 목록→상세로 전환) */
:root{
  --bg:#f5f7f8; --panel:#ffffff; --ink:#1d2a30; --muted:#5f7078; --line:#dbe3e6;
  --accent:#2f5d6e; --accent-ink:#ffffff; --soft:#e6eff2; --warn:#a35a00; --warn-bg:#fff2dc; --ok:#1d7a4d; --ok-bg:#e2f4ea;
  --font:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12191c; --panel:#1b2428; --ink:#e7eef0; --muted:#9db0b8; --line:#2f3d43;
  --accent:#7db7cc; --accent-ink:#0f1d23; --soft:#243239; --warn:#f0b35c; --warn-bg:#3a2c14; --ok:#6fcf9b; --ok-bg:#16322a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12191c; --panel:#1b2428; --ink:#e7eef0; --muted:#9db0b8; --line:#2f3d43;
  --accent:#7db7cc; --accent-ink:#0f1d23; --soft:#243239; --warn:#f0b35c; --warn-bg:#3a2c14; --ok:#6fcf9b; --ok-bg:#16322a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:6px}
h1{font-size:22px;margin:0;font-weight:700}
.sp{flex:1}.nav2{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}.syncst{font-size:12.5px;color:var(--muted)}.syncst.ok{color:var(--ok)}.syncst.bad{color:#d62d2d;font-weight:700}
.sample{font-size:12px;background:var(--warn-bg);color:var(--warn);padding:3px 9px;border-radius:99px}
.lead{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.list{padding:12px;position:sticky;top:12px}
.list input[type=search]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--muted);padding:3px 10px;border-radius:99px;font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
ul.cl{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto}
ul.cl button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 6px;color:var(--ink);font:inherit;cursor:pointer}
ul.cl .sub{white-space:nowrap;flex:none}
ul.cl button:hover{background:var(--soft)}
ul.cl button[aria-current=true]{background:var(--soft);font-weight:700}
.sub{color:var(--muted);font-size:12.5px;font-weight:400}
.count{color:var(--muted);font-size:12.5px;margin:6px 2px}
.detail{padding:18px;min-width:0}
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.dh h2{margin:0;font-size:20px}
.back{display:none;border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;margin-bottom:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;color:var(--muted);font:inherit;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:110px;resize:vertical}
.full{grid-column:1/-1}
h3{font-size:14px;margin:20px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.saved{font-size:12.5px;color:var(--ok)}
.periods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line)}
.chk input{margin-top:5px}
.chk .memo{flex:1;min-width:0}
.chk .memo input[type=text]{margin-top:4px;padding:5px 8px;font-size:13px}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--accent)}
.hist{font-size:12.5px;color:var(--muted);margin-top:14px}
.empty{padding:50px 16px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .list{position:static}
  .app[data-view=detail] .list{display:none}
  .app[data-view=list] .detail{display:none}
  .back{display:inline-block}
}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:middle}
.tbl th{background:var(--soft);font-weight:500;color:var(--muted);font-size:12.5px}
.tbl input[type=text]{border:0;background:transparent;padding:3px 2px}
.tw{overflow-x:auto;margin-bottom:6px}
.grp{font-size:13px;font-weight:700;color:var(--accent);margin:18px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--soft)}
.hint2{font-size:12.5px;color:var(--muted);margin:3px 0 0 28px}
.sign{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px}
.sign label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13.5px}
.bul{margin:6px 0 0;padding-left:18px;color:var(--ink)}
.tag{display:inline-block;font-size:12px;background:var(--soft);color:var(--ink);padding:2px 8px;border-radius:99px;margin-right:4px}

:root{--rule:#44545b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rule:#8ea4ac}}
:root[data-theme="dark"]{--rule:#8ea4ac}
.paper{background:var(--panel);border:1px solid var(--line);padding:18px 16px;max-width:800px;margin:0 auto}
.paper h2.ttl{font-size:20px;text-align:center;margin:4px 0 14px;letter-spacing:.02em}
.paper h2.ttl input{font:inherit;text-align:center;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);padding:2px 4px;width:auto;max-width:100%}
.ht{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:10px;table-layout:fixed}
.ht th,.ht td{border:1px solid var(--rule);padding:4px 6px;vertical-align:middle;word-break:keep-all}
.ht th{background:var(--soft);font-weight:500;text-align:center;font-size:12.5px;color:var(--ink)}
.ht td.c{text-align:center}
.ht td.l{background:none}
.ht input[type=text],.ht textarea,.ht select{border:0;background:transparent;padding:3px 2px;border-radius:0;width:100%;font-size:13.5px}
.ht input[type=text]:focus,.ht textarea:focus,.ht select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--bg)}
.ht textarea{min-height:90px;resize:vertical}
.ht td.cb{text-align:center;width:46px}
.ht td.nt{width:30%}
.tr{display:flex;gap:6px;align-items:center;margin:4px 0}.tr input[type=text]{flex:1;min-width:0}.tr input[data-f=h],.tr input[data-f=n]{flex:.6}.tg{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:8px 0}
.ht td.gp{width:70px;text-align:center;background:var(--soft);font-weight:500}
.ht input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.cmpgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.cmpgrid .paper{overflow-x:auto;min-width:0;margin:0;max-width:none;width:100%}
.cmpgrid .ht{min-width:500px}
.cmpgrid .two{grid-template-columns:minmax(0,1fr)!important}
.app[data-wide="1"]{grid-template-columns:minmax(0,1fr)}
.app[data-wide="1"] .list{display:none}
.app[data-wide="1"] .back{display:inline-block}
body:has(.app[data-wide="1"]) .wrap{max-width:1700px}
.ht .in td,.ht .in th{font-size:12px;word-break:break-all}.ht .in td.c{padding:4px 2px}
.box{border:1px solid var(--rule);margin-bottom:12px}
.box>div.bt{text-align:center;border-bottom:1px solid var(--rule);padding:3px;font-size:13px;background:var(--soft)}
.box textarea{border:0;background:transparent;width:100%;min-height:120px;padding:8px;font:inherit;font-size:13.5px;color:var(--ink);resize:vertical;border-radius:0}
.box textarea.tall{min-height:200px}
.box textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
.line{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;margin-bottom:8px;align-items:center}
.line label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13.5px}
.line input[type=text],.line select{width:auto;min-width:110px;padding:4px 6px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.ctl input[type=text]{width:auto;min-width:190px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:none;border:1px solid var(--warn);color:var(--warn)}
.addf{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--bg)}
.addf input,.addf select{width:100%}
.addf select{width:auto}
.offbanner{background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:13.5px}
.inl{flex-direction:row!important;align-items:center;gap:6px!important;color:var(--ink)!important;font-size:13.5px!important}
.hdr select,.hdr input{width:auto}
.hdr{padding:8px 10px;background:var(--soft);border-radius:6px}
.cset{margin:0 0 14px;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.cset summary{cursor:pointer;color:var(--muted);font-size:13px}
.cset .ctl{margin:10px 0 0}
.taxgrid{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:14px;align-items:start}
@media (max-width:1100px){.taxgrid{grid-template-columns:minmax(0,1fr)}}
.cmpgrid .taxgrid{grid-template-columns:minmax(0,1fr)}
.tx td.cc.ov{background:var(--warn-bg)}
.tx tr.keyr th,.tx tr.keyr td{background:#e6eefb}
.tx tr.keyr td.cc.ov{background:var(--warn-bg)}
.tx tr:last-child td.cc input{font-weight:700}
.tx th.yr,.tx td.yr{border-left:4px solid #d62d2d!important;border-right:4px solid #d62d2d!important}
.tx th.yr{border-top:4px solid #d62d2d!important}
.tx tr:last-child td.yr{border-bottom:4px solid #d62d2d!important}
.tx td.exr input{color:#d62d2d;font-weight:800}
.paper{position:relative}
.cover{table-layout:auto}.cover td:nth-child(2),.cover th:nth-child(2){min-width:84px}.cover td.nmc{overflow-wrap:anywhere;word-break:keep-all;line-height:1.35;padding:6px 8px;min-width:120px}
.cover select.isel{width:100%;min-width:62px;font:inherit;font-size:13px;text-align:center;padding:4px 2px;border:0;background:transparent;color:var(--ink)}
.help{margin:-4px 0 10px;font-size:12px}.help summary{cursor:pointer;color:var(--accent)}
.tx th .rdel{float:right;margin-left:4px;opacity:.55}.tx th:hover .rdel{opacity:1}
.tx th.xn{white-space:nowrap}.tx th.xn input{width:84px;font-size:12px;padding:2px 3px}
.rowtools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.rowtools .mini{margin:0}
.memo{margin-top:14px}.memo .sh{font-weight:700;margin-bottom:6px}
.memo textarea{width:100%;min-height:240px;resize:vertical;font:inherit;line-height:1.55;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);box-sizing:border-box}
.savepic{position:absolute;top:8px;right:8px;z-index:2;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--ink)}
.paper .selc,.paper td.selc{outline:2px solid #2a6fdb;outline-offset:-2px;background:rgba(42,111,219,.14)!important}
.picmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.picmodal .pm{background:var(--panel);border-radius:10px;max-width:96vw;max-height:94vh;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.picmodal img{max-width:100%;height:auto;border:1px solid var(--line)}
.side{display:flex;flex-direction:column;gap:10px;font-size:12px}
.sbox{border:1px solid var(--line);border-radius:8px;padding:8px}
.sbox .sh{font-weight:700;font-size:12px;margin-bottom:6px}
.sm th,.sm td{font-size:11.5px;padding:2px 3px}
.sm input{font-size:11.5px;padding:2px 3px;min-width:0;width:100%}
.sm td.nm{min-width:96px}.sm td.x{width:22px;text-align:center}
.bw{overflow-x:auto}.bw .sm{min-width:330px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:0 6px;cursor:pointer;font-size:12px;line-height:18px}
.mini.add{margin:6px 0 2px}
.tx td.cc input{text-align:right}
.tx th{white-space:nowrap}.tx tr:first-child th{white-space:normal;font-size:12px}.paper.taxp{max-width:1150px}.cmpgrid .paper.taxp{max-width:none}.tx td.cc input{min-width:92px}.sm td.cc input{min-width:0}.bw .sm{min-width:400px}
.mo{width:34px!important;text-align:center;border:1px solid var(--line)!important;display:inline-block;padding:1px 2px!important}
.sig{display:grid;grid-template-columns:auto 1fr 1fr;width:240px;margin-left:auto;border:1px solid var(--rule);font-size:12.5px}
.sig div{border:1px solid var(--rule);padding:4px 6px;text-align:center}
.sig .tall2{grid-row:span 2;display:flex;align-items:center}
.sig label{flex-direction:row;justify-content:center;gap:4px;color:var(--ink);font-size:12.5px}
.smallx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 2px}
@media (max-width:1100px){.cmpgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.two{grid-template-columns:1fr!important}.paper{padding:12px 8px;overflow-x:auto}.ht{min-width:560px}.paper h2.ttl{font-size:17px}}
</style>

<body>
<div class="wrap">
  <header><h1>업체별 기장</h1><a class="nav2" href="index.html?tab=tpl">← 직원 메뉴</a><span class="sp"></span><span id="whoami" class="sub"></span><span class="syncst" id="syncst" role="status"></span><button class="btn ghost sm" type="button" id="impBtn">업체 한꺼번에 넣기</button><button class="btn ghost sm" type="button" id="xl">엑셀로 내보내기</button></header>
  <p class="lead">이 프로그램은 동감 세무회계 업무 용도로 제작된 것으로 외부 유출 및 공유를 금합니다. 적은 내용은 자동으로 저장되고, 누가 언제 고쳤는지 기록됩니다.</p>
  <div class="app" id="app" data-view="list">
    <aside class="panel list">
      <input type="search" id="q" placeholder="업체명 검색" aria-label="업체명 검색">
      <div class="chips" id="chips"></div>
      <div class="chips" id="chips2"></div>
      <div class="chips" id="chips3"></div>
      <div id="addbox"></div>
      <div class="count" id="count"></div>
      <ul class="cl" id="cl"></ul>
    </aside>
    <main class="panel detail" id="detail"></main>
  </div>
</div>
<script>
var CLIENTS=[];
var STATUS=["거래중","폐업","이탈"],SVCS=["기장","신고"];
function stOf(c){return c.status||"거래중"}
var PEOPLE=["이동희","김혜빈","김유리","이연서"];
// 부가세 체크 목록 (올려주신 순서 그대로). k: normal / deemed(의제매입 표) / limit(1기·2기 표)
var VAT_ITEMS=[
 {t:"부가세 신고서 vs 통합조회서비스 대사하였는지?"},
 {t:"법인) 예정/확정신고 모두 체크하였는지"},
 {t:"수기세금계산서 여부 확인하였는지?"},
 {t:"휴·폐업 여부 확인하였는지?((1기의 경우 7월 간이→일반 변경도 확인)"},
 {t:"쿠팡 네이버 등 외에 홈택스에 안 뜨는 판매대행 매출은 없는지?"},
 {t:"세금계산서, 신용카드 매입 중복 확인(통신, 전력비, 네이버 충전 등)"},
 {t:"세금계산서 불공제분 확인(특히 차량 및 토지 관련 유의)"},
 {t:"고정자산 매입 확인"},
 {t:"홈택스 등록 안 된 신용카드 여부 확인하였는지"},
 {t:"경차나 트럭이 있는 경우 유류대 부가세 공제 처리하였는지"},
 {t:"사업용 신용카드 중 불공제 대상(접대, 비영업, 개인사용 외) 확인",h:"특히 목욕, 이발, 미용, 여객운송, 택시, 볼링, 학원 등"},
 {k:"deemed",t:"의제 매입 신고서 확인",h:"(법인 O, 간이과세자 X)"},
 {t:"공통매입 세액 안분 대상 확인"},
 {t:"신용카드 매출전표 발행 세액공제 해당 확인(법인, 전년도 10억 불가)",ph:"업태"},
 {k:"limit",t:"신용카드 매출 세액공제 한도초과 확인"},
 {t:"예정고지세액 / 예정신고 미환급세액 확인"},
 {t:"세금계산서 관련 가산세 확인(MRI)"},
 {t:"신고서 뒷장 면세 수입금액 및 매입 계산서 수취명세 금액 확인"},
 {t:"과표명세 상 업종코드 및 업태별 매출 구분 확인(소득세 신고에 영향)"},
 {t:"간주임대료 계산하였는가(주택 아닌 부동산 임대)"},
 {t:"일반<->간이 변경 시 재고매입세액/재고납부세액 확인하였는지"}

function taxCompute(P,yr,isCorp){
  var R=function(k){var n=nvk(P,k);return n===null?0:n},O=function(k,def){var n=nvk(P,k);return n===null?def:n};
  var months=Math.max(1,Math.min(12,nvk(P,"months")||9));
  var tbl=function(y){return isCorp?(y>=2026?CORP_NEW:CORP_OLD):IND_TBL};
  var bz=(val(P+"bl")||"").split(",").filter(Boolean),dl=(val(P+"dl","0,1,2,3")||"").split(",").filter(Boolean);
  var hid={};(val(P+"hid")||"").split(",").forEach(function(h){if(h)hid[h]=1});
  var xl=(val(P+"xl")||"").split(",").filter(Boolean),z=function(id,v){return hid[id]?0:v};
  var B={ids:bz,rev:0,cogs:0,sga:0,inc:0};
  bz.forEach(function(i){var r=R("b"+i+"|rev"),g=R("b"+i+"|cogs"),a=R("b"+i+"|sga"),n=O("b"+i+"|inc",r-g-a);B["inc"+i]=n;B.rev+=r;B.cogs+=g;B.sga+=a;B.inc+=n});
  function build(c,y,rawMain,mp,dp){
    var x={},k=function(id){return c+"|"+id},hb=c==="J"&&bz.length>0;
    x.rev=hb?O(k("rev"),B.rev):rawMain?R(k("rev")):O(k("rev"),mp.rev*12/months);
    x.cogs=z("cogs",hb?O(k("cogs"),B.cogs):rawMain?R(k("cogs")):O(k("cogs"),mp.cogs*12/months));

    x.adj=z("adj",rawMain?R(k("adj")):O(k("adj"),mp.adj));

}

function refreshTax(){

    var row=function(it,path,extra){return '<div class="tr" data-p="'+path+'"><input type="text" data-f="t" value="'+esc(it.t)+'" aria-label="항목 문구"'+(extra?'':'')+'>'+
      (kind==="vat"?(it.k?'<span class="sub" style="white-space:nowrap">'+(it.k==="deemed"?"의제매입 표":"한도 표")+'</span>':'<input type="text" data-f="h" value="'+esc(it.h||"")+'" placeholder="작은 설명(선택)" aria-label="작은 설명">'):(corp?'<input type="text" data-f="n" value="'+esc(it.n||"")+'" placeholder="기본 비고(선택)" aria-label="기본 비고">':''))+
      '<button type="button" class="btn ghost sm" data-a="up" title="위로">▲</button><button type="button" class="btn ghost sm" data-a="dn" title="아래로">▼</button><button type="button" class="btn ghost sm" data-a="del" title="삭제">✕</button></div>'};
    if(kind==="vat"){
      W.forEach(function(it,i){h+=row(it,String(i))});
      h+='<div><button type="button" class="btn ghost sm" data-a="add">+ 항목 추가</button></div>';
    } else {
      W.forEach(function(g,gi){
        h+='<div class="tg"><div class="tr" data-p="'+gi+'"><input type="text" data-f="g" value="'+esc(g.g)+'" aria-label="구분 이름" style="font-weight:600"><span class="sub">구분</span>'+
         '<button type="button" class="btn ghost sm" data-a="up">▲</button><button type="button" class="btn ghost sm" data-a="dn">▼</button><button type="button" class="btn ghost sm" data-a="del">구분 삭제</button></div>';
        g.rows.forEach(function(r,ri){h+=row(r,gi+"."+ri)});
        h+='<div><button type="button" class="btn ghost sm" data-a="add" data-p="'+gi+'">+ 항목 추가</button></div></div>';
      });
      h+='<div><button type="button" class="btn ghost sm" data-a="addg">+ 구분 추가</button></div>';
    }
    h+='<div class="sub" id="tplInfo"></div><div style="display:flex;gap:8px;position:sticky;bottom:0;background:var(--panel);padding-top:6px"><button class="btn" type="button" id="tplSave">저장 (모든 업체에 적용)</button><button class="btn ghost" type="button" data-picclose>닫기</button></div></div>';
    m.innerHTML=h;
  }
  function sync(){ // 입력칸 내용을 W에 반영
    m.querySelectorAll("input[data-f]").forEach(function(el){
      var p=el.closest("[data-p]").dataset.p.split("."),f=el.dataset.f;
      if(f==="g")W[+p[0]].g=el.value;else{var it=kind==="vat"?W[+p[0]]:W[+p[0]].rows[+p[1]];it[f]=el.value}
    });
  }
  draw();document.body.appendChild(m);
  m.addEventListener("click",function(ev){
    if(ev.target===m||ev.target.closest("[data-picclose]")){m.remove();return}
    var b=ev.target.closest("[data-a]");if(!b)return;sync();
    var a=b.dataset.a,box=b.closest("[data-p]"),p=box?box.dataset.p.split("."):[];
    if(kind==="vat"){
      if(a==="add")W.push({id:newTid(),t:"",h:"",ph:"",k:""});
      else if(a==="up")mv(W,+p[0],-1);else if(a==="dn")mv(W,+p[0],1);else if(a==="del")W.splice(+p[0],1);
    } else {
      if(a==="addg")W.push({g:"새 구분",rows:[{id:newTid(),t:"",n:""}]});
      else if(a==="add"){W[+b.dataset.p].rows.push({id:newTid(),t:"",n:""})}
      else if(p.length===1){if(a==="up")mv(W,+p[0],-1);else if(a==="dn")mv(W,+p[0],1);else if(a==="del")W.splice(+p[0],1)}
      else{var rs=W[+p[0]].rows;if(a==="up")mv(rs,+p[1],-1);else if(a==="dn")mv(rs,+p[1],1);else if(a==="del")rs.splice(+p[1],1)}
    }
    var top=m.firstChild.scrollTop;draw();m.firstChild.scrollTop=top;
  });
  m.addEventListener("click",function(ev){
    var b=ev.target.closest("#tplSave");if(!b)return;sync();
    var out=kind==="vat"?W.filter(function(it){return it.t.trim()}):W.map(function(g){return {g:g.g.trim(),rows:g.rows.filter(function(r){return r.t.trim()})}}).filter(function(g){return g.g&&g.rows.length});
    var info=m.querySelector("#tplInfo");
    if(!out.length){info.textContent="항목이 하나도 없습니다.";return}
    b.disabled=true;info.textContent="저장하는 중…";
    api("template.save",{kind:kind,tpl:out}).then(function(r){TPL[kind]=r.tpl;m.remove();drawDetail();refreshProg()})
      .catch(function(e){b.disabled=false;info.textContent="실패: "+e.message});
  });
}

/* ===== 엑셀로 내보내기 (메뉴별 시트) ===== */
function xnum(v){if(v==null||v==="")return "";var t=String(v).replace(/,/g,"");return /^-?\d+(\.\d+)?$/.test(t)&&t.length<16?Number(t):String(v)}
function ox(v){return v?"O":""}
function inClient(id,fn){var old=state.sel;state.sel=id;try{return fn()}finally{state.sel=old}}
function sheetRows(cols,rows){return [cols.map(function(c){return c.h})].concat(rows)}
function xlsxLib(cb){
  if(window.XLSX)return cb(null);
  var sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  sc.onload=function(){cb(null)};sc.onerror=function(){cb("load")};document.head.appendChild(sc);
}
function exportBook(){
  var base=function(c){return [c.name,c.type||"",c.owner||"",c.svc||"기장",stOf(c)]};
  var BH=["업체명","구분","담당","기장/신고","상태"];
  var sheets=[];
  // 1. 업체목록
  sheets.push(["업체목록",[BH.concat(["사유","비고","마지막 수정자","마지막 수정일시"])].concat(CLIENTS.map(function(c){return base(c).concat([c.reason||"",c.tier||"",c.by||"",c.at?hhmm(c.at):""])}))]);
  // 2. 기본정보
  var infoCols=[["업종","info|업종"],["창업감면","info|창업감면"],["중기특감","info|중기특감"],["고용증대","info|고용증대"],["성실신고","info|성실신고"],["기본 사항","info|basic"],["원천세","info|wht"],["부가세 신고시 참고사항","info|vatnote"],["법인세/소득세 신고시 참고사항","info|taxnote"]];
  sheets.push(["기본정보",[BH.concat(infoCols.map(function(x){return x[0]}))].concat(CLIENTS.map(function(c){return inClient(c.id,function(){return base(c).concat(infoCols.map(function(x){return val(x[1])}))})}))]);
  // 3. 부가세
  var vrows=[],maxPc=3;
  CLIENTS.forEach(function(c){state.data[c.id]&&state.data[c.id].vps.forEach(function(p){maxPc=Math.max(maxPc,+(inClient(c.id,function(){return val("vat|"+p.id+"|pc","3")})))})});
  var vh=BH.concat(["회차","상호","작성일","담당자","업종","사업자유형"]);
  for(var i=0;i<maxPc;i++)vh.push("과세기간"+(i+1),"부가율"+(i+1));
  vh.push("부가율 비고","메모","신용카드 국세청 기준","신용카드 실제 공제","현금영수증 국세청 기준","현금영수증 실제 공제","과다공제 차량명","과다공제 공제여부");
  [["매출","sales"],["매입Ti","buyti"],["매입기타","buyetc"],["기납부","paid"],["세금","tax"]].forEach(function(r){vh.push("계산서 "+r[0]+" 전기","계산서 "+r[0]+" 당기","계산서 "+r[0]+" 비고")});
  var INV=[["임차료","rent"],["관리비","mgmt"],["전력비","power"],["통신비","tel"],["기장료","fee"],["조정료","adj"],["비고","note"]];
  INV.forEach(function(r){vh.push("세금계산서 체크 "+r[0])});
  TPL.vat.forEach(function(it){
    if(it.k==="deemed"){DEEMED.forEach(function(r){vh.push("의제매입 "+r[0]+" 체크","의제매입 "+r[1]+" 체크")})}
    else if(it.k==="limit"){vh.push("신용카드 세액공제 한도초과 1기","신용카드 세액공제 한도초과 2기")}
    else vh.push(it.t,it.t+" 비고");
  });
  vh.push("결재 작성자","결재 대표세무사");
  CLIENTS.forEach(function(c){var D=state.data[c.id];if(!D)return;D.vps.forEach(function(p){inClient(c.id,function(){
    var P="vat|"+p.id+"|",pc=+val(P+"pc","3"),defs=["2025년 2기","2026년 1기","2026년 2기"];
    var r=base(c).concat([p.name,val(P+"co",c.name),val(P+"date"),val(P+"owner"),val(P+"biz",val("info|업종")),val(P+"kind",c.type||"")]);
    for(var i=0;i<maxPc;i++){if(i<pc)r.push(val(P+"ph"+i,defs[i]||""),val(P+"pv"+i));else r.push("","")}
    r.push(val(P+"pn"),val(P+"memo"),xnum(val(P+"cc0")),xnum(val(P+"cc1")),xnum(val(P+"cr0")),xnum(val(P+"cr1")),val(P+"car"),val(P+"cared"));
    ["sales","buyti","buyetc","paid","tax"].forEach(function(k){r.push(xnum(val(P+k+"a")),xnum(val(P+k+"b")),val(P+k+"n"))});
    INV.forEach(function(x){r.push(x[1]==="note"?val(P+"inv|note"):xnum(val(P+"inv|"+x[1])))});
    TPL.vat.forEach(function(it){
      if(it.k==="deemed"){DEEMED.forEach(function(_,j){r.push(ox(val(P+"dm"+j+"a")),ox(val(P+"dm"+j+"b")))})}
      else if(it.k==="limit"){r.push(xnum(val(P+"lm1")),xnum(val(P+"lm2")))}
      else r.push(ox(val(P+"c"+it.id)),val(P+"n"+it.id));
    });
    r.push(ox(val(P+"s1")),ox(val(P+"s2")));
    vrows.push(r);
  })})});
  sheets.push(["부가세",[vh].concat(vrows)]);
  // 4. 소득세
  var irows=[],ih=BH.concat(["귀속연도","일련번호","기장/신고","이름","거래처명","작성일","담당자","신고유형","25년 소득","25년 부가율","25년 조정료","24년 소득","24년 부가율","24년 조정료"]);
  TPL.inc.forEach(function(g){g.rows.forEach(function(r){ih.push(r.t,r.t+" 비고")})});
  ih.push("결재 작성자","결재 대표세무사");
  CLIENTS.forEach(function(c){var D=state.data[c.id];if(!D)return;D.ips.forEach(function(p){inClient(c.id,function(){
    var P="inc|"+p.id+"|",r=base(c).concat([p.name,val(P+"no"),val(P+"mode"),val(P+"nm"),val(P+"co",c.name),val(P+"date"),val(P+"owner"),val(P+"kind"),xnum(val(P+"i0")),val(P+"r0"),xnum(val(P+"f0")),xnum(val(P+"i1")),val(P+"r1"),xnum(val(P+"f1"))]);
    TPL.inc.forEach(function(g){g.rows.forEach(function(row){r.push(ox(val(P+"c"+row.id)),val(P+"n"+row.id,row.n))})});
    r.push(ox(val(P+"s1")),ox(val(P+"s2")));irows.push(r);
  })})});
  sheets.push(["소득세",[ih].concat(irows)]);
  // 5. 법인세
  var crows=[],ch=BH.concat(["사업연도","법인명","작성일","담당자","25년 매출","25년 법인세","25년 조정료","24년 매출","24년 법인세","24년 조정료"]);
  TPL.corp.forEach(function(g){g.rows.forEach(function(r){ch.push(r.t,r.t+" 비고")})});
  ch.push("MEMO, 특이사항 및 확인사항","결재 작성자","결재 대표세무사");
  CLIENTS.forEach(function(c){var D=state.data[c.id];if(!D)return;D.cps.forEach(function(p){inClient(c.id,function(){
    var P="corp|"+p.id+"|",r=base(c).concat([p.name,val(P+"co",c.name),val(P+"date"),val(P+"owner"),xnum(val(P+"s0")),xnum(val(P+"t0")),xnum(val(P+"f0")),xnum(val(P+"s1")),xnum(val(P+"t1")),xnum(val(P+"f1"))]);
    TPL.corp.forEach(function(g){g.rows.forEach(function(row){r.push(ox(val(P+"c"+row.id)),val(P+"n"+row.id,row.n))})});
    r.push(val(P+"memo"),ox(val(P+"s1")),ox(val(P+"s2")));crows.push(r);
  })})});
  sheets.push(["법인세",[ch].concat(crows)]);
  // 6. 세금예측
  var TR=[["rev","수입금액"],["cogs","매출원가"],["sga","판매관리비 등"],["extra","추가경비"],["income","사업소득금액(법인은 당기순이익)"],["adj","세무조정"],["other","다른 종합소득금액"],["loss","이월결손금"],["ded","종합소득공제"],["base","과세표준"],["tax","산출세액"],["credit","세액공제 및 감면"],["dec","결정세액"],["local","지방소득세"],["paid","기납부세액"],["nong","농특세(고용증대)"],["pay","납부할세액"]];
  var th=BH.concat(["연도","가결산 개월수"]);
  TR.forEach(function(r){th.push(r[1]+" 예측",r[1]+" 가결산",r[1]+" 전년도")});
  th.push("공제·감면 입력 (항목: 예측/가결산/전년도)","추가한 경비 줄 (항목: 예측/가결산/전년도)","사업자별 가결산 (사업자: 매출/매출원가/판관비/사업소득)","뺀 줄","상담 메모");
  var trows=[];
  var RN={rev:"수입금액",cogs:"매출원가",sga:"판매관리비 등",extra:"추가경비",adj:"세무조정",other:"다른 종합소득금액",loss:"이월결손금",ded:"종합소득공제",credit:"세액공제 및 감면",local:"지방소득세",paid:"기납부세액",nong:"농특세"};
  CLIENTS.forEach(function(c){var D=state.data[c.id];if(!D)return;D.tps.forEach(function(p){inClient(c.id,function(){
    var P="tax|"+p.id+"|",isCorp=c.type==="법인",res=taxCompute(P,yearOf(p.name),isCorp),r=base(c).concat([p.name,res.months]);
    TR.forEach(function(x){var k=x[0],skip=isCorp&&(k==="other"||k==="ded");["I","J","K"].forEach(function(cc){r.push(skip?"":Math.round(res[cc][k]||0))})});
    r.push(res.dl.map(function(i){return val(P+"dn"+i,DED_NAMES[i]||"")+": "+Math.round(res.I["d"+i])+"/"+Math.round(res.J["d"+i])+"/"+Math.round(res.K["d"+i])}).join("; "));
    r.push(res.xl.map(function(i){return (val(P+"xn"+i)||"(이름 없음)")+": "+Math.round(res.I["x"+i])+"/"+Math.round(res.J["x"+i])+"/"+Math.round(res.K["x"+i])}).join("; "));
    r.push(res.B.ids.map(function(i){var q="b"+i+"|";return (val(P+q+"nm")||"(이름 없음)")+": "+(nvk(P,q+"rev")||0)+"/"+(nvk(P,q+"cogs")||0)+"/"+(nvk(P,q+"sga")||0)+"/"+Math.round(res.B["inc"+i])}).join("; "));
    r.push(Object.keys(res.hid).map(function(k){return RN[k]||k}).join(", "));
    r.push(val(P+"memo"));trows.push(r);
  })})});
  sheets.push(["세금예측",[th].concat(trows)]);
  return sheets;
}
function exportXlsx(){
  var btn=$("#xl");btn.disabled=true;var old=btn.textContent;btn.textContent="만드는 중…";
  flush().then(function(){
    xlsxLib(function(err){
      try{
        if(err||!window.XLSX)throw new Error("엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
        var wb=XLSX.utils.book_new();
        exportBook().forEach(function(s){var ws=XLSX.utils.aoa_to_sheet(s[1]);ws["!cols"]=s[1][0].map(function(h,i){return {wch:i===0?24:Math.min(40,Math.max(10,String(h).length+2))}});ws["!freeze"]={xSplit:1,ySplit:1};XLSX.utils.book_append_sheet(wb,ws,s[0])});
        var t=new Date(),stamp=t.getFullYear()+("0"+(t.getMonth()+1)).slice(-2)+("0"+t.getDate()).slice(-2);
        XLSX.writeFile(wb,"업체별기장_"+stamp+".xlsx");
      }catch(e){alert(e.message)}
      btn.disabled=false;btn.textContent=old;
    });
  });
}

$("#impBtn").onclick=function(){openImport(false)};$("#xl").onclick=exportXlsx;$("#whoami").textContent=ME?ME+" 님":"";
show();boot();
